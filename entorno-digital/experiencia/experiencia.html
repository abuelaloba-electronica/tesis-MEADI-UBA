<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiencia interactiva (MAEDI)</title>
<style>
  /* Roboto Light (y Bold para el "Paso N"), local en fuentes/ (sin CDN: la
     página se abre por file://). */
  @font-face {
    font-family: "Roboto"; font-style: normal; font-weight: 700;
    src: local("Roboto Bold"), local("Roboto-Bold"), url("fuentes/roboto-latin-700-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Roboto"; font-style: normal; font-weight: 300;
    src: local("Roboto Light"), local("Roboto-Light"), url("fuentes/roboto-latin-300-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Roboto"; font-style: italic; font-weight: 300;
    src: local("Roboto Light Italic"), local("Roboto-LightItalic"), url("fuentes/roboto-latin-300-italic.woff2") format("woff2");
  }
  :root {
    --ink: #111;
    --suave: #888;
    --acento: #ECFC2B;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #fff;
    color: var(--ink);
    font-family: "Roboto", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 300;
  }
  /* Los controles de formulario no heredan la tipografía por defecto. */
  button, input, select, textarea { font-family: inherit; font-weight: inherit; }
  body { display: flex; align-items: center; justify-content: center; }

  #pantalla {
    box-sizing: border-box;
    width: min(880px, 100vw);
    padding: 48px 32px;
    font-size: clamp(20px, 2.4vw, 30px);
    line-height: 1.45;
    text-align: center;
  }
  #pantalla p { margin: 0 0 0.9em; font-size: 24px; font-style: italic; }
  #pantalla .cita { margin-bottom: 0.25em; }
  /* Resaltador: cubre todo el alto de la tipografía. */
  #pantalla mark {
    color: inherit;
    padding: 0 0.1em;
    background: var(--acento);
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  #pantalla .autoria + .cita { margin-top: 3.5em; }
  #pantalla .autoria { font-size: 18px; font-style: normal; }
  /* Pantalla 3: a los 3 s el texto se desenfoca y queda así. */
  #pantalla .desdibuja { animation: desdibujar 3s ease-in 3s forwards; }
  @keyframes desdibujar { to { filter: blur(6px); opacity: 0.6; } }
  /* Pantalla 4: rótulo "Paso N" y debajo una lista con viñetas, todo
     alineado a la izquierda. El bloque se ajusta al ancho de la línea más
     larga y va centrado. Las viñetas caen en el borde izquierdo del rótulo
     y el texto que da vuelta queda alineado con el de su línea. */
  #pantalla .con-paso { width: fit-content; margin: 0 auto; text-align: left; }
  #pantalla .paso { font-weight: 700; font-style: normal; margin-bottom: 0.6em; }
  #pantalla .con-paso ul { list-style: none; margin: 0; padding: 0; }
  #pantalla .con-paso li {
    position: relative; padding-left: 1.1em; margin-bottom: 0.5em;
    font-size: 24px; font-style: italic;
  }
  #pantalla .con-paso li::before { content: "•"; position: absolute; left: 0; font-style: normal; }
  #pantalla .nota { font-size: 0.6em; color: var(--suave); margin-top: 2em; }
  #pantalla .logo { display: block; width: min(456px, 100%); margin: 3.5em auto 0; }
  #pie {
    position: fixed;
    bottom: 14px; right: 18px;
    font-size: 11px;
    color: #aaa;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<section id="pantalla"></section>
<div id="pie"></div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Recorrido de la experiencia. Las pantallas de texto viven acá; la 5,
  // la 6 y la 7 son páginas propias (las visualizaciones de cada
  // dispositivo) que capturan su lienzo con la barra espaciadora y
  // avanzan con → hasta volver a experiencia.html#8. Desde acá sólo se
  // entra a la 5: a los dispositivos no se vuelve hacia atrás.
  //
  // Por ahora todo es texto negro sobre blanco; el texto sale del
  // guion "experiencia-interactiva-guion.md". Cada pantalla es una lista de
  // párrafos { texto, clase }; con `imagen`, el texto es su descripción, y
  // `resaltar` lista fragmentos del texto a marcar, en orden de aparición;
  // `paso` pone ese rótulo, en negrita y resaltado, arriba de `lista`, que
  // va con viñetas.
  // ---------------------------------------------------------------
  const PANTALLAS = {
    0: [
      { texto: "Bienvenid@ a esta exploración interactiva a través de tu cuerpo, textiles electrónicos y un ambiente digital.", resaltar: ["exploración interactiva"] },
      { texto: "Esta investigación se enmarca en mi proyecto de tesis para culminar la Maestría en Diseño Interactivo." },
      { texto: "¡Gracias por participar!" },
      { imagen: "Logo_MAEDI+UBA.jpg", texto: "Maestría en Diseño Interactivo, FADU, UBA", clase: "logo" },
    ],
    1: [
      { texto: "Los datos de tu actividad fisiológica y motriz darán lugar a una composición gráfica en el ambiente digital, a través de textiles electrónicos portados en tu cuerpo.", resaltar: ["ambiente digital", "textiles electrónicos", "cuerpo"] },
      { texto: "Durante la experiencia, tomate el tiempo que creas necesario, contempla el momento y disfruta." },
      { texto: ":)" },
    ],
    2: [
      { texto: "“Un ciborg es un organismo cibernético, un híbrido de máquina y organismo, una criatura de realidad social y también de ficción”", clase: "cita", resaltar: ["híbrido de máquina y organismo"] },
      { texto: "Donna Haraway (1984)", clase: "autoria" },
      { texto: "“Simpoiesis es una palabra sencilla, significa generar-con. Nada se hace a sí mismo, nada es realmente autopoiético o autoorganizado.”", clase: "cita", resaltar: ["Simpoiesis", "generar-con"] },
      { texto: "Donna Haraway (2019)", clase: "autoria" },
    ],
    3: [
      { texto: "Frontera entre humano y máquina se desdibuja", clase: "desdibuja" },
    ],
    4: [
      { paso: "# Paso 1", lista: [
        "Porta sobre tu antebrazo y tu mano derecha el dispositivo uno.",
        "Mueve tu mano derecha en diferentes direcciones.",
        "Explora los movimientos de tu mano y lo que traduce la pantalla.",
        "Captura la composición gráfica pulsando la barra espaciadora.",
        "Para borrar todo e iniciar nuevamente pulsa la tecla Retroceso.",
      ] },
    ],
    8: [
      { texto: "Llegaste casi al final de la experiencia, tu cuerpo generó datos para una composición gráfica." },
      { texto: "Para finalizar selecciona las zonas de las composiciones que creas que son las más ricas en cuanto a tus gustos personales para generar tu obra y la máquina las capturará. Al finalizar podrías cambiar la colorimetría si lo deseas." },
      { texto: "¡Gracias nuevamente por ser parte de esta investigación!" },
    ],
  };
  const ULTIMA_DE_TEXTO = 4;
  const PRIMER_DISPOSITIVO = "bandada_prototipo_v5a_experiencia.html";
  const CIERRE = 8;

  const pantallaEl = document.getElementById("pantalla");
  const pieEl = document.getElementById("pie");
  let actual = 0;

  function parrafo(texto, clase, resaltar) {
    const p = document.createElement("p");
    let desde = 0;
    (resaltar || []).forEach(function (fragmento) {
      const i = texto.indexOf(fragmento, desde);
      if (i < 0) return;
      const marca = document.createElement("mark");
      marca.textContent = fragmento;
      p.append(texto.slice(desde, i), marca);
      desde = i + fragmento.length;
    });
    p.append(texto.slice(desde));
    if (clase) p.className = clase;
    return p;
  }

  function imagen(src, alt, clase) {
    const img = document.createElement("img");
    img.src = src;
    img.alt = alt;
    if (clase) img.className = clase;
    return img;
  }

  function mostrar(n) {
    actual = n;
    pantallaEl.textContent = "";
    mostrarTexto(n);
    pieEl.textContent = n === CIERRE
      ? n + " / " + CIERRE
      : n + " / " + CIERRE + "  ·  ← →";
  }

  function mostrarTexto(n) {
    (PANTALLAS[n] || []).forEach(function (par) {
      if (par.imagen) pantallaEl.appendChild(imagen(par.imagen, par.texto, par.clase));
      else if (par.paso) pantallaEl.appendChild(conPaso(par));
      else pantallaEl.appendChild(parrafo(par.texto, par.clase, par.resaltar));
    });
  }

  function conPaso(par) {
    const bloque = document.createElement("div");
    bloque.className = "con-paso";
    const lista = document.createElement("ul");
    par.lista.forEach(function (linea) {
      const li = document.createElement("li");
      li.textContent = linea;
      lista.appendChild(li);
    });
    bloque.append(parrafo(par.paso, "paso", [par.paso]), lista);
    return bloque;
  }

  // El número de pantalla vive en el hash: recargar no pierde el lugar, y
  // la última visualización vuelve con experiencia.html#8.
  function desdeHash() {
    const n = parseInt(location.hash.slice(1), 10);
    if (n === CIERRE || (n >= 0 && n <= ULTIMA_DE_TEXTO)) return n;
    return 0;
  }
  function ir(n) {
    if (location.hash === "#" + n) mostrar(n);
    else location.hash = "#" + n;     // hashchange llama a mostrar()
  }
  window.addEventListener("hashchange", function () { mostrar(desdeHash()); });

  // Para la próxima persona: borra las capturas guardadas por las páginas
  // de los dispositivos (IndexedDB "experiencia", almacén "capturas").
  function borrarCapturas() {
    return new Promise(function (ok) {
      if (typeof indexedDB === "undefined") return ok();
      const pedido = indexedDB.open("experiencia", 1);
      pedido.onupgradeneeded = function () { pedido.result.createObjectStore("capturas"); };
      pedido.onerror = function () { ok(); };
      pedido.onsuccess = function () {
        const db = pedido.result;
        const tx = db.transaction("capturas", "readwrite");
        tx.objectStore("capturas").clear();
        tx.oncomplete = tx.onerror = function () { db.close(); ok(); };
      };
    });
  }

  window.addEventListener("keydown", function (e) {
    if (actual === CIERRE) {
      // Tecla del operador para reiniciar el recorrido.
      if (e.key === "Home") borrarCapturas().then(function () { ir(0); });
      return;
    }
    if (e.key === "ArrowRight") {
      if (actual < ULTIMA_DE_TEXTO) ir(actual + 1);
      else location.href = PRIMER_DISPOSITIVO;
    } else if (e.key === "ArrowLeft") {
      if (actual > 0) ir(actual - 1);
    }
  });

  mostrar(desdeHash());
})();
</script>
</body>
</html>
