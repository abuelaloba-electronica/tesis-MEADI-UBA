      case "grabando":  return "Grabando  " + minSeg(ahora - video.desde) + " / " + minSeg(sonido.duracion);
      case "cerrando":  return "Preparando la descarga…";
      default:          return video.error || "Descargar obra";
    }
  }

  // Se ve en el modo final con sonido, y mientras dura una grabación o su
  // error aunque el sonido se haya pausado.
  function actualizarBotonVideo() {
    const ocupado = video.estado !== "libre";
    const visible = ocupado || !!video.error || puedeGrabarVideo();
    botonVideo.classList.toggle("visible", visible);
    botonVideo.classList.toggle("ocupado", ocupado);
    botonVideo.classList.toggle("error", !ocupado && !!video.error);
    const texto = textoBotonVideo();
    if (botonVideoTexto.textContent !== texto) botonVideoTexto.textContent = texto;
  }

  botonVideo.addEventListener("click", function () {
    // Sin foco: Enter o la barra espaciadora no lo vuelven a apretar.
    botonVideo.blur();
    if (video.estado === "libre" && !video.error) empezarVideo();
  });

  // Con la pestaña oculta no hay cuadros (requestAnimationFrame se detiene)
  // pero el sonido sigue: el video saldría congelado.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && (video.estado === "esperando" || video.estado === "grabando")) {
      fallarVideo(null, "Se ocultó la página: no se guardó el video");
    }
  });

  // ===============================================================
  // ENTRADA · Gestos de puntero. Al apretar se elige uno según lo que hay
  // bajo el puntero (tirador, elemento o vacío), y desde ahí el despachador
  // de eventos sólo le pasa el movimiento, sin saber cuál es. Cada gesto es
  // un objeto con
  //   mover(m)         el puntero se movió (m en coordenadas del marco)
  //   terminar(movio)  se soltó; movio dice si pasó el umbral de arrastre
  //   pintar(c, f)     opcional: lo que dibuja encima de la escena
  // Agregar un gesto nuevo (rotar, por ejemplo) es una función más y una
  // línea en iniciarGesto.
  // ===============================================================

  // Arrastrar la selección.
  function gestoMover(m0) {
    const antes = historial.foto();
    const trasladar = prepararTraslado(seleccionados(), escena);
    return {
      mover: function (m) { if (trasladar) trasladar(m.x - m0.x, m.y - m0.y); },
      terminar: function (movio) { if (movio && trasladar) historial.registrar(antes); }
    };
  }

  // Arrastrar el tirador: el factor es cuánto se alejó el puntero del centro
  // de la selección respecto de donde lo agarró, así que no salta al
  // empezar aunque no se lo haya tomado justo en la esquina.
  function gestoEscalar(m0) {
    const antes = historial.foto();
    const escalado = prepararEscalado(seleccionados(), escena);
    const p = escalado && escalado.pivote;
    const d0 = p ? Math.hypot(m0.x - p.x, m0.y - p.y) : 0;
    return {
      mover: function (m) {
        if (d0 > 0) escalado.aplicar(Math.hypot(m.x - p.x, m.y - p.y) / d0);
      },
      terminar: function (movio) { if (movio && d0 > 0) historial.registrar(antes); }
    };
  }

  // Marco de selección: elige todo lo que toca, incluso lo tapado. Con
  // Mayús suma a lo que ya estaba seleccionado. La selección se actualiza
  // mientras se arrastra, para ver qué va a quedar adentro.
  function gestoMarco(m0, sumar) {
    const base = sumar ? new Set(seleccion) : new Set();
    let rect = null;
    seleccion = new Set(base);
    return {
      mover: function (m) {
        rect = rectEntre(m0, m);
        seleccion = new Set(base);
        for (const el of elementosEnRect(escena.elementos, rect)) seleccion.add(el.id);
      },
      terminar: function () { rect = null; },
      pintar: function (c, f) { if (rect) pintarMarcoDeSeleccion(c, rect, f); }
    };
  }

  // Elige el gesto y, si el clic era sobre un elemento, actualiza la
  // selección. null si el clic no empieza ningún gesto.
  function iniciarGesto(e, m) {
    if (tocaTirador(e.clientX, e.clientY)) return gestoEscalar(m);
    const el = elementoEn(escena.elementos, m.x, m.y, m.px);
    if (!el) return gestoMarco(m, e.shiftKey);
    if (e.shiftKey) {
      if (seleccion.has(el.id)) { seleccion.delete(el.id); return null; }
      seleccion.add(el.id);
    } else if (!seleccion.has(el.id)) {
      // Un clic sobre algo ya seleccionado conserva la selección: así se
      // arrastra un grupo entero tomándolo de cualquiera de sus elementos.
      seleccion = new Set([el.id]);
    }
    return gestoMover(m);
  }

  // { id, cx0, cy0, movio, h }: el puntero que lo empezó, dónde, si ya pasó
  // el umbral de arrastre, y el gesto.
  let gesto = null;

  function aMarco(e) {
    const f = encajeVentana();
    return { x: (e.clientX - f.ox) / f.k, y: (e.clientY - f.oy) / f.k, px: 1 / f.k };
  }

  function editable() {
    return !!escena && vista === "vector" && etapa !== "final";
  }

  function cursorEn(e) {
    if (tocaTirador(e.clientX, e.clientY)) return "nwse-resize";
    const m = aMarco(e);
    return elementoEn(escena.elementos, m.x, m.y, m.px) ? "move" : "default";
  }

  lienzo.addEventListener("pointerdown", function (e) {
    if (etapa === "final") { reanudarSonido(); return; }
    if (e.button !== 0 || !editable() || gesto) return;
    cancelarConfirmacion();
    terminarRueda();
    const h = iniciarGesto(e, aMarco(e));
    if (h) {
      gesto = { id: e.pointerId, cx0: e.clientX, cy0: e.clientY, movio: false, h: h };
      if (lienzo.setPointerCapture) lienzo.setPointerCapture(e.pointerId);
    }
    pedirDibujo();
  });

  lienzo.addEventListener("pointermove", function (e) {
    if (!editable()) return;
    if (!gesto) { lienzo.style.cursor = cursorEn(e); return; }
    if (e.pointerId !== gesto.id) return;
    if (!gesto.movio &&
        Math.hypot(e.clientX - gesto.cx0, e.clientY - gesto.cy0) < UMBRAL_ARRASTRE_PX) return;
    gesto.movio = true;
    gesto.h.mover(aMarco(e));
    pedirDibujo();
  });

  function terminarGesto(e) {
    if (!gesto || e.pointerId !== gesto.id) return;
    gesto.h.terminar(gesto.movio);
    gesto = null;
    pedirDibujo();
  }
  lienzo.addEventListener("pointerup", terminarGesto);
  lienzo.addEventListener("pointercancel", terminarGesto);

  // ===============================================================
  // ENTRADA · Rueda: escala la selección respecto de su centro, con el
  // mismo escalado que el tirador. Una ráfaga de rueda (eventos separados
  // por menos de RUEDA_PAUSA_MS) es un solo paso del historial.
  // ===============================================================
  let rueda = null;   // { escalado, antes, k, temporizador }

  function terminarRueda() {
    if (!rueda) return;
    clearTimeout(rueda.temporizador);
    if (rueda.k !== 1) historial.registrar(rueda.antes);
    rueda = null;
  }

  lienzo.addEventListener("wheel", function (e) {
    // Ctrl+rueda es el zoom del navegador: no se lo quitamos.
    if (!editable() || gesto || e.ctrlKey) return;
    if (!rueda) {
      const escalado = prepararEscalado(seleccionados(), escena);
      if (!escalado) return;
      cancelarConfirmacion();
      rueda = { escalado: escalado, antes: historial.foto(), k: 1, temporizador: 0 };
    }
    e.preventDefault();
    const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    rueda.k = rueda.escalado.aplicar(rueda.k * Math.exp(-delta * RUEDA_K));
    clearTimeout(rueda.temporizador);
    rueda.temporizador = setTimeout(terminarRueda, RUEDA_PAUSA_MS);
    pedirDibujo();
  }, { passive: false });

  // ===============================================================
  // ENTRADA · Color y opacidad de la selección. Con algo seleccionado que
  // admita `color`, arriba a la izquierda aparece una muestra discreta: sólo
  // el color del seleccionado de más arriba (partida en diagonal si la
  // selección mezcla colores), sin código ni nombre. Al tocarla se abre el
  // panel: el selector de color y la opacidad.
  //
  // El color o la opacidad que se mueve pasa a los destinos (lo otro queda
  // como estaba en cada elemento). Con un solo elemento seleccionado, el
  // destino es ése. Con más de uno, el panel suma una casilla por cada tipo
  // presente en la selección ("Aplicar a todos los anillos", "… los
  // cuadriláteros", "… los círculos", "… los puntos"), y los destinos son
  // los seleccionados de los tipos marcados. Arrancan marcadas, y se vuelven
  // a marcar todas cada vez que cambia la selección. Marcar o desmarcar no
  // cambia nada en el acto: decide a qué le llega el próximo cambio. Sin
  // ninguna marcada, el color y la opacidad quedan deshabilitados.
  //
  // Arrastrar en el selector o en el deslizador es una ráfaga, como la de la
  // rueda: un solo paso del historial, que se cierra al soltar (`change`),
  // con cualquier tecla, o al cerrar el panel (un clic fuera, Esc, o tocar
  // otra vez la muestra).
  // ===============================================================
  const muestraEl = document.getElementById("muestraColor");
  const muestraTintaEl = document.getElementById("muestraColorTinta");
  const panelColorEl = document.getElementById("panelColor");
  const colorEl = document.getElementById("colorElegido");
  const opacidadEl = document.getElementById("opacidadElegida");
  const opacidadValorEl = document.getElementById("opacidadValor");
  const tiposColorEl = document.getElementById("colorTipos");
  // Orden y nombre de las casillas. El disco del FSR, para quien edita, es
  // un círculo.
  const PLURALES = { anillo: "anillos", cuadrilatero: "cuadriláteros", disco: "círculos", punto: "puntos" };

  let rafagaColor = null;           // foto del historial antes de la ráfaga en curso
  let firmaSeleccionColor = "";     // para rearmar las casillas si cambia la selección
  let tiposExcluidos = new Set();   // los tipos desmarcados
  let fondoMuestra = "";

  // El <input type="color"> sólo acepta #rrggbb, y las capturas guardan lo
  // que devolvió el canvas (#rrggbb o rgba(...)) o "#000". El propio canvas
  // lo normaliza.
  const normalizador = document.createElement("canvas").getContext("2d");
  function hexDe(color) {
    normalizador.fillStyle = "#000000";
    normalizador.fillStyle = String(color);
    const v = normalizador.fillStyle;
    if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
    const m = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(v);
    if (!m) return "#000000";
    return "#" + [m[1], m[2], m[3]].map(function (n) {
      return (+n).toString(16).padStart(2, "0");
    }).join("");
  }

  function coloreables() { return admiten(seleccionados(), "color"); }

  function destinosDeColor() {
    const sel = coloreables();
    if (sel.length < 2) return sel;
    return sel.filter(function (el) { return !tiposExcluidos.has(el.tipo); });
  }

  function cambiarEstilo(cambio) {
    if (!editable()) return;
    const destinos = destinosDeColor();
    if (!destinos.length) return;
    if (!rafagaColor) { cancelarConfirmacion(); rafagaColor = historial.foto(); }
    aplicarEstilo(destinos, cambio);
    pedirDibujo();
  }

  // Elegir el mismo color que ya tenía no es un paso del historial.
  function cerrarRafagaColor() {
    if (!rafagaColor) return;
    const antes = rafagaColor;
    rafagaColor = null;
    if (JSON.stringify(antes) !== JSON.stringify(escena.elementos)) historial.registrar(antes);
  }

  function panelColorAbierto() { return panelColorEl.classList.contains("visible"); }

  function abrirPanelColor() {
    panelColorEl.classList.add("visible");
    muestraEl.setAttribute("aria-expanded", "true");
    actualizarColor();
  }

  function cerrarPanelColor() {
    if (!panelColorAbierto()) return;
    cerrarRafagaColor();
    if (panelColorEl.contains(document.activeElement)) document.activeElement.blur();
    panelColorEl.classList.remove("visible");
    muestraEl.setAttribute("aria-expanded", "false");
  }

  // Una casilla por tipo presente, todas marcadas; ninguna con un solo
  // elemento.
  function armarCasillas(sel) {
    tiposExcluidos = new Set();
    tiposColorEl.textContent = "";
    if (sel.length < 2) return;
    const presentes = new Set(sel.map(function (el) { return el.tipo; }));
    const tipos = Object.keys(PLURALES).filter(function (t) { return presentes.has(t); });
    presentes.forEach(function (t) { if (tipos.indexOf(t) < 0) tipos.push(t); });
    for (const tipo of tipos) {
      const fila = document.createElement("label");
      fila.className = "todos";
      const caja = document.createElement("input");
      caja.type = "checkbox";
      caja.checked = true;
      caja.addEventListener("change", function () {
        cerrarRafagaColor();
        if (caja.checked) tiposExcluidos.delete(tipo); else tiposExcluidos.add(tipo);
        actualizarColor();
      });
      const texto = document.createElement("span");
      texto.textContent = "Aplicar a todos los " + (PLURALES[tipo] || tipo);
      fila.appendChild(caja);
      fila.appendChild(texto);
      tiposColorEl.appendChild(fila);
    }
  }

  // Lo llama actualizarPie en cada repintado: muestra u oculta la muestra,
  // la pinta, rearma las casillas si cambió la selección y, con el panel
  // abierto y sin una ráfaga en curso (mientras se arrastra manda el
  // control, no la escena), pone el panel al día con el de más arriba de
  // los destinos, por ejemplo después de deshacer.
  function actualizarColor() {
    const sel = editable() ? coloreables() : [];
    if (!sel.length) {
      cerrarPanelColor();
      muestraEl.classList.remove("visible");
      firmaSeleccionColor = "";
      return;
    }
    muestraEl.classList.add("visible");

    const colores = [];
    for (let i = sel.length - 1; i >= 0 && colores.length < 2; i--) {
      const c = hexDe(sel[i].estilo.color);
      if (colores.indexOf(c) < 0) colores.push(c);
    }
    const fondo = colores.length > 1
      ? "linear-gradient(135deg, " + colores[0] + " 50%, " + colores[1] + " 50%)"
      : colores[0];
    if (fondo !== fondoMuestra) { fondoMuestra = fondo; muestraTintaEl.style.background = fondo; }

    const firma = sel.map(function (el) { return el.id; }).join(",");
    if (firma !== firmaSeleccionColor) {
      firmaSeleccionColor = firma;
      armarCasillas(sel);
    }

    if (panelColorAbierto() && !rafagaColor) {
      const destinos = destinosDeColor();
      const sinDestino = !destinos.length;
      colorEl.disabled = opacidadEl.disabled = sinDestino;
      const arriba = sinDestino ? sel[sel.length - 1] : destinos[destinos.length - 1];
      const hex = hexDe(arriba.estilo.color);
      const pct = String(Math.round(arriba.estilo.alpha * 100));
      if (colorEl.value !== hex) colorEl.value = hex;
      if (opacidadEl.value !== pct) opacidadEl.value = pct;
      opacidadValorEl.textContent = pct + " %";
    }
  }

  muestraEl.addEventListener("click", function () {
    // Sin foco: la barra espaciadora no la vuelve a apretar.
    muestraEl.blur();
    if (panelColorAbierto()) cerrarPanelColor(); else abrirPanelColor();
  });

  // Un clic fuera de la muestra y del panel lo cierra (y, si fue en el
  // lienzo, además hace lo suyo: seleccionar otra cosa, por ejemplo).
  document.addEventListener("pointerdown", function (e) {
    if (!panelColorAbierto() || muestraEl.contains(e.target) || panelColorEl.contains(e.target)) return;
    cerrarPanelColor();
  }, true);

  colorEl.addEventListener("input", function () { cambiarEstilo({ color: colorEl.value }); });
  colorEl.addEventListener("change", function () {
    cambiarEstilo({ color: colorEl.value });
    cerrarRafagaColor();
  });
  opacidadEl.addEventListener("input", function () {
    opacidadValorEl.textContent = opacidadEl.value + " %";
    cambiarEstilo({ alpha: opacidadEl.value / 100 });
  });
  opacidadEl.addEventListener("change", cerrarRafagaColor);

  // ===============================================================
  // ENTRADA · Cierre de la edición: la barra espaciadora pulsada dos veces,
  // como en las pantallas 5, 7 y 9. La primera sólo muestra el aviso; la
  // segunda, antes de CONFIRMAR_MS, pasa al modo final. Mientras el aviso
  // está a la vista se puede seguir editando, pero cualquier edición lo
  // cancela: el aviso pregunta por la composición tal como estaba.
  // ===============================================================
  const avisoEl = document.getElementById("aviso");
  let temporizadorConfirmar = 0;
  // La escritura de la composición en curso: ← e Inicio esperan a que
  // termine, para no perderla ni borrarla a medio escribir. Nunca rechaza.
  let guardado = Promise.resolve();

  document.getElementById("avisoCerrar").addEventListener("click", cancelarConfirmacion);

  function pedirConfirmacion() {
    etapa = "confirmando";
    avisoEl.classList.add("visible");
    temporizadorConfirmar = setTimeout(cancelarConfirmacion, CONFIRMAR_MS);
  }

  function cancelarConfirmacion() {
    if (etapa !== "confirmando") return;
    clearTimeout(temporizadorConfirmar);
    etapa = "edicion";
    avisoEl.classList.remove("visible");
  }

  // Definitivo. Corre dentro del manejador de la tecla: el AudioContext se
  // crea primero, mientras dura el gesto.
  function finalizar() {
    clearTimeout(temporizadorConfirmar);
    cerrarPanelColor();
    etapa = "final";
    iniciarSonido();
    avisoEl.classList.remove("visible");
    seleccion.clear();
    portapapeles.plantillas = [];
    vista = "vector";
    lienzo.style.cursor = "default";
    guardado = guardarComposicion().then(function () {}, function (err) {
      notaGuardado = "no se pudo guardar la composición (" + (err && err.message || err) + ")";
      pedirDibujo();
    });
    pedirDibujo();
  }

  function irA(destino) {
    guardado.then(function () { location.href = destino; });
  }

  // ===============================================================
  // ENTRADA · Teclado
  // ===============================================================
  const MODIFICADORES = ["Shift", "Control", "Alt", "Meta", "AltGraph", "CapsLock"];

  window.addEventListener("keydown", function (e) {
    // Con el foco en el panel de color, las teclas son de sus controles (las
    // flechas mueven el deslizador, la barra marca la casilla): no navegan,
    // no borran ni cierran la edición. Esc cierra el panel; Ctrl+algo
    // (deshacer, copiar) sigue de largo.
    if (panelColorEl.contains(e.target)) {
      if (e.key === "Escape") { e.preventDefault(); cerrarPanelColor(); return; }
      if (!(e.ctrlKey || e.metaKey)) return;
    }
    // Cualquier tecla cierra la ráfaga de rueda o de color: deshacer justo
    // después de escalar con la rueda tiene que deshacer el escalado.
    terminarRueda();
    cerrarRafagaColor();
    const ctrl = e.ctrlKey || e.metaKey;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (e.key === "ArrowLeft") {
      irA("experiencia.html#10");
      return;
    }
    if (e.key === "Home") {
      // En la demo no se borra nada: la base es de la instalación.
      if (DEMO) { location.href = "experiencia.html#0"; return; }
      guardado.then(borrarCapturas).then(function () { location.href = "experiencia.html#0"; });
      return;
    }
    if (etapa === "final") {
      // Nada edita. Una tecla sólo despierta el sonido si el navegador lo
      // dejó en pausa (al recargar en este modo no hubo gesto).
      if (e.code === "Space" || e.key === " ") e.preventDefault();
      reanudarSonido();
      return;
    }
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      // Sin e.repeat: mantener la barra apretada no puede confirmar sola. En
      // medio de un arrastre tampoco: el gesto quedaría a medio aplicar.
      if (e.repeat || gesto || !escena || !hayCapturas) return;
      if (etapa === "confirmando") finalizar(); else pedirConfirmacion();
      return;
    }
    if (etapa === "confirmando") {
      if (MODIFICADORES.indexOf(e.key) >= 0) return;
      cancelarConfirmacion();
      // Esc sólo cancela: no deselecciona.
      if (e.key === "Escape") return;
    }
    if (k === "v" && !ctrl && !e.repeat) {
      if (gesto) return;
      vista = vista === "vector" ? "png" : "vector";
      lienzo.style.cursor = "default";
      pedirDibujo();
    } else if (!editable() || gesto) {
      // Con los PNG a la vista o en medio de un gesto, nada edita.
      return;
    } else if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      if (!e.repeat) eliminarSeleccion();
    } else if (e.key === "Escape") {
      // Con el panel de color abierto, Esc sólo lo cierra.
      if (panelColorAbierto()) cerrarPanelColor(); else seleccion.clear();
      pedirDibujo();
    } else if (ctrl && k === "c") {
      e.preventDefault();
      copiarSeleccion();
    } else if (ctrl && k === "v") {
      e.preventDefault();
      if (!e.repeat) pegarPortapapeles();
    } else if (ctrl && k === "z") {
      e.preventDefault();
      if (e.shiftKey) rehacer(); else deshacer();
    } else if (ctrl && k === "y") {
      e.preventDefault();
      rehacer();
    }
  });

  window.addEventListener("resize", ajustarLienzo);
  window.addEventListener("hashchange", function () { location.reload(); });

  // ===============================================================
  // DATOS · IndexedDB
  // ===============================================================
  function abrirBase() {
    return new Promise(function (ok, mal) {
      if (typeof indexedDB === "undefined") return mal(new Error("IndexedDB no disponible"));
      const pedido = indexedDB.open("experiencia", 1);
      pedido.onupgradeneeded = function () { pedido.result.createObjectStore("capturas"); };
      pedido.onerror = function () { mal(pedido.error); };
      pedido.onsuccess = function () { ok(pedido.result); };
    });
  }

  // Devuelve { capturas: { clave: registro }, composicion } con las
  // capturas que existan y la composición finalizada (o null).
  function leerBase() {
    return abrirBase().then(function (db) {
      return new Promise(function (ok, mal) {
        const tx = db.transaction("capturas", "readonly");
        const almacen = tx.objectStore("capturas");
        const leidas = { capturas: {}, composicion: null };
        CAPAS.forEach(function (clave) {
          const p = almacen.get(clave);
          p.onsuccess = function () { if (p.result && p.result.imagen) leidas.capturas[clave] = p.result; };
        });
        const pc = almacen.get(CLAVE_COMPOSICION);
        pc.onsuccess = function () { leidas.composicion = pc.result || null; };
        tx.oncomplete = function () { db.close(); ok(leidas); };
        tx.onerror = function () { db.close(); mal(tx.error); };
      });
    });
  }

  // La composición finalizada va en el mismo almacén que las capturas, así
  // que Inicio (clear) la borra con ellas. Registro:
  //   { version: 1, ancho, alto, elementos, fuentes, fecha }
  // `elementos` son los de la escena tal cual (con sus `tiempos`); `fuentes`
  // anota la `fecha` de cada captura usada, para saber si sigue valiendo.
  const CLAVE_COMPOSICION = "composicion";

  function fuentesDe(caps) {
    const f = {};
    CAPAS.forEach(function (k) { if (caps[k]) f[k] = caps[k].registro.fecha; });
    return f;
  }

  function guardarComposicion() {
    if (DEMO) return Promise.resolve();
    const registro = {
      version: 1,
      ancho: escena.ancho,
      alto: escena.alto,
      elementos: copiaProfunda(escena.elementos),
      fuentes: fuentesDe(capturas),
      fecha: Date.now()
    };
    return abrirBase().then(function (db) {
      return new Promise(function (ok, mal) {
        const tx = db.transaction("capturas", "readwrite");
        tx.objectStore("capturas").put(registro, CLAVE_COMPOSICION);
        tx.oncomplete = function () { db.close(); ok(); };
        tx.onerror = tx.onabort = function () { db.close(); mal(tx.error); };
      });
    });
  }

  // La escena de una composición guardada, o null si no sirve. Sólo vale si
  // se hizo con las mismas capturas que hay ahora: si se volvió a capturar
  // alguna pantalla (otra `fecha`, o una captura que falta o sobra), es otro
  // recorrido, y se vuelve a la edición con la escena reconstruida. Los
  // tiempos de sus anillos y discos son de la grabación con que se hizo.
  function escenaGuardada(comp, caps) {
    if (!comp || !(comp.version >= 1) || !Array.isArray(comp.elementos) ||
        !finito(comp.ancho, comp.alto) || !comp.fuentes) return null;
    const actuales = fuentesDe(caps);
    const claves = Object.keys(actuales);
    if (claves.length !== Object.keys(comp.fuentes).length) return null;
    for (const k of claves) if (comp.fuentes[k] !== actuales[k]) return null;
    const elementos = comp.elementos.filter(function (el) {
      return el && propio(TIPOS, el.tipo) && finito(el.x, el.y, el.escala, el.id) && el.forma && el.estilo;
    });
    for (const el of elementos) proximoId = Math.max(proximoId, el.id + 1);
    return { ancho: comp.ancho, alto: comp.alto, elementos: elementos };
  }

  function borrarCapturas() {
    return abrirBase().then(function (db) {
      return new Promise(function (ok) {
        const tx = db.transaction("capturas", "readwrite");
        tx.objectStore("capturas").clear();
        tx.oncomplete = tx.onerror = function () { db.close(); ok(); };
      });
    }).catch(function () {});
  }

  // ===============================================================
  // DATOS · Demo: registros de captura sintéticos, en el mismo formato que
  // guardan las copias, para que pasen por el mismo camino de conversión.
  // Semilla fija: la demo es siempre la misma escena.
  // ===============================================================
  function registrosDemo() {
    let s = 20261104;
    function azar() {                 // mulberry32
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function entre(a, b) { return a + azar() * (b - a); }
    const W = window.innerWidth, H = window.innerHeight, menor = Math.min(W, H);

    // EMG: cuadriláteros irregulares de dos familias, superpuestos al centro.
    const tonos = ["#ff8080", "#ff4040", "#cc0000", "#990000",
                   "#d4cd80", "#beb340", "#867b00", "#655c00"];
    const emg = [];
    for (let i = 0; i < 14; i++) {
      const cx = W / 2 + entre(-0.28, 0.28) * W, cy = H / 2 + entre(-0.25, 0.25) * H;
      const sa = menor * entre(0.08, 0.16), sb = sa * entre(1.1, 1.8);
      const esq = [[-sb, -sa], [sb, -sa], [sb, sa], [-sb, sa]];
      emg.push({ tipo: "cuadrilatero", color: tonos[i % tonos.length], alpha: entre(0.35, 0.75),
        puntos: esq.map(function (p) {
          return [cx + p[0] + entre(-0.3, 0.3) * sa, cy + p[1] + entre(-0.3, 0.3) * sa];
        }) });
    }

    // Guante: anillos de los dos dedos y un disco del FSR, en multiply, con
    // los tiempos y los eventos que anotaría la página del guante. Los
    // tiempos no salen de azar(): así la escena es la misma de antes.
    const guante = [], eventos = [];
    for (let i = 0; i < 12; i++) {
      const r = menor * entre(0.03, 0.12);
      const t = i * 520 + (i * 37 % 11) * 25;
      const vel = 60 + (i * 23) % 60;
      guante.push({ tipo: "anillo", dedo: i % 2, x: entre(0.1, 0.9) * W, y: entre(0.1, 0.9) * H,
        r: r, grosor: Math.max(1, r * 0.35), color: i % 2 ? "#847575" : "#eef202",
        alpha: entre(0.5, 0.95), modo: "multiply", t: t });
      eventos.push({ t: t, tipo: "nota", nota: 52 + i % 2 * 7, vel: vel, dedo: i % 2 });
    }
    // El FSR, apretado de 2,4 s a 4,2 s: el CC1 sube en rampa y vuelve a 0.
    const P0 = 2400, P1 = 4200;
    guante.push({ tipo: "disco", x: W * 0.62, y: H * 0.45, r: menor * 0.1,
      color: "#151923", alpha: 0.55, modo: "multiply", t0: P0, t1: P1 });
    for (let t = P0, v = 20; t < P1; t += 150, v = Math.min(110, v + 15)) {
      eventos.push({ t: t, tipo: "cc", valor: v });
    }
    eventos.push({ t: P1, tipo: "cc", valor: 0 });
    eventos.sort(function (a, b) { return a.t - b.t; });
    // Duración: el último evento más la cola (COLA_MS en la página del guante).
    const sonidoDemo = { audio: null, duracion: (eventos[eventos.length - 1].t + 2000) / 1000,
      eventos: eventos, latenciaMs: 0 };

    // Bandada: puntos negros, más un pájaro partido por el borde izquierdo
    // con su copia fantasma del lado derecho, como los deja el campo
    // continuo.
    const bandada = [];
    for (let i = 0; i < 40; i++) {
      const z = entre(-1, 1);
      bandada.push({ tipo: "punto", x: W / 2 + entre(-0.2, 0.2) * W, y: H / 2 + entre(-0.15, 0.15) * H,
        r: 4.5 * (0.7 + 0.3 * (z + 1)), alpha: 0.3 + 0.7 * (z + 1) / 2, color: "#0a0a0a" });
    }
    bandada.push({ tipo: "punto", x: 2, y: H * 0.3, r: 6, alpha: 1, color: "#0a0a0a" });
    bandada.push({ tipo: "punto", x: W + 2, y: H * 0.3, r: 6, alpha: 1, color: "#0a0a0a" });

    function registro(elementos) {
      return { ancho: W, alto: H, dpr: DPR, elementos: elementos, version: 1, fecha: 0 };
    }
    const regGuante = registro(guante);
    regGuante.version = 2;
    regGuante.sonido = sonidoDemo;
    return { emg: registro(emg), guante: regGuante, bandada: registro(bandada) };
  }

  // ===============================================================
  // DATOS · Arranque
  // ===============================================================
  function mostrarFaltantes(faltan) {
    if (faltan.length === CAPAS.length) {
      vacioEl.classList.add("visible");
      return;
    }
    if (faltan.length) {
      pieBase = "falta: " + faltan.map(function (k) { return NOMBRES[k]; }).join(", ") +
        "   ·   11 / 11  ·  ←";
    }
    actualizarPie();
  }

  // Llena `capturas` y resuelve la composición guardada (o null). La demo
  // no lee la base: nunca tiene composición guardada.
  function cargar() {
    if (DEMO) {
      const regs = registrosDemo();
      CAPAS.forEach(function (k) { capturas[k] = { registro: regs[k], bitmap: null }; });
      return Promise.resolve(null);
    }
    return leerBase()
      .then(function (leidas) {
        return Promise.all(CAPAS.map(function (clave) {
          const r = leidas.capturas[clave];
          if (!r) return null;
          capturas[clave] = { registro: r, bitmap: null };
          // El PNG ya no hace falta para la escena; se decodifica para el
          // diagnóstico (V) y para las capturas sin `elementos`.
          return createImageBitmap(r.imagen).then(function (bmp) {
            capturas[clave].bitmap = bmp;
          }, function () { /* PNG ilegible: la escena sigue con los elementos */ });
        })).then(function () { return leidas.composicion; });
      })
      .catch(function (err) {
        vacioEl.textContent = "No se pudieron leer las capturas (" + (err && err.message || err) + ").";
        return null;
      });
  }

  cargar().then(function (composicion) {
    hayCapturas = CAPAS.some(function (k) { return capturas[k]; });
    // Se prepara ya, en los dos modos: al confirmar tiene que estar listo.
    bufferSonido = prepararSonido(capturas.guante);
    const guardada = escenaGuardada(composicion, capturas);
    if (guardada) {
      escena = guardada;
      etapa = "final";
      // Sin gesto: lo más probable es que el navegador lo deje en pausa
      // hasta la primera tecla o clic (el pie lo dice).
      iniciarSonido();
    } else {
      escena = construirEscena(capturas);
    }
    ajustarLienzo();
    mostrarFaltantes(CAPAS.filter(function (k) { return !capturas[k]; }));
  });

  // Enganches de diagnóstico (consola o un harness de Node): la página no
  // los usa.
  window.__escena = function () { return escena; };
  window.__sonido = function () {
    return { etapa: etapa, estado: sonido.ctx ? sonido.ctx.state : null,
             reloj: relojSonido(), duracion: sonido.duracion, motivo: motivoSinSonido,
             cuadro: cuadroActual };
  };
  window.__video = function () {
    return { estado: video.estado, error: video.error, formato: formatoDeVideo(),
             ancho: video.lienzo ? video.lienzo.width : null,
             alto: video.lienzo ? video.lienzo.height : null,
             desde: video.desde, hasta: video.hasta, ultima: video.ultima };
  };
  // El efecto de las reacciones sobre un elemento en el cuadro actual (o
  // en `cuadro`, si se pasa uno), sin `encima`.
  window.__efecto = function (id, cuadro) {
    const c = cuadro || cuadroActual;
    const el = escena && escena.elementos.find(function (e) { return e.id === id; });
    if (!el || !c || !reacciones) return null;
    const ef = reacciones(el, c);
    return { dx: ef.dx, dy: ef.dy, escala: ef.escala, alpha: ef.alpha, onda: !!ef.encima };
  };
})();
</script>
</body>
</html>
