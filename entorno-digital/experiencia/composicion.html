<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiencia · 11 · Composición (MAEDI)</title>
<style>
  /* Roboto Light, local en fuentes/ (sin CDN: la página se abre por file://). */
  @font-face {
    font-family: "Roboto"; font-style: normal; font-weight: 300;
    src: local("Roboto Light"), local("Roboto-Light"), url("fuentes/roboto-latin-300-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Roboto"; font-style: italic; font-weight: 300;
    src: local("Roboto Light Italic"), local("Roboto-LightItalic"), url("fuentes/roboto-latin-300-italic.woff2") format("woff2");
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #fff;
    color: #111;
    font-family: "Roboto", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 300;
  }
  /* Un solo lienzo con todos los elementos de las tres capturas. Queda
     transparente: el blanco lo pone el body, igual que en las copias. */
  #escena {
    position: fixed; top: 0; left: 0; display: block;
    touch-action: none;           /* el arrastre es nuestro, no del navegador */
    user-select: none; -webkit-user-select: none;
  }
  #vacio {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    padding: 32px; box-sizing: border-box; text-align: center;
    font-size: 24px; font-style: italic; color: #888;
  }
  #vacio.visible { display: flex; }
  #pie {
    position: fixed;
    bottom: 14px; right: 18px;
    font-size: 11px;
    color: #aaa;
    font-variant-numeric: tabular-nums;
    white-space: pre;
  }

  /* Aviso de confirmación: el mismo de las pantallas 5, 7 y 9 (la anatomía
     y los tokens del Alert de Ant Design, escrito a mano). */
  .aviso {
    position: fixed;
    top: 24px; left: 50%;
    transform: translate(-50%, -8px);
    width: min(560px, calc(100vw - 32px));
    box-sizing: border-box;
    display: flex; gap: 12px; align-items: flex-start;
    padding: 16px 20px 16px 16px;
    border: 1px solid #91caff;
    border-radius: 8px;
    background: #e6f4ff;
    color: rgba(0,0,0,0.88);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08), 0 3px 6px -4px rgba(0,0,0,0.12);
    font-size: 14px; line-height: 1.57;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 20;
  }
  .aviso.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .aviso-icono {
    flex-shrink: 0;
    width: 22px; height: 22px; margin-top: 1px;
    border-radius: 50%;
    background: #1677ff; color: #fff;
    font: bold 14px/22px Georgia, serif; text-align: center;
  }
  .aviso-cuerpo { flex: 1; }
  .aviso-titulo { font-size: 16px; line-height: 1.5; margin-bottom: 4px; }
  .aviso-texto { white-space: pre-line; }
  .aviso-cerrar {
    flex-shrink: 0;
    width: auto; margin: 0;
    border: none; background: transparent; cursor: pointer;
    font-size: 20px; line-height: 1; padding: 0 2px;
    color: rgba(0,0,0,0.45);
  }
  .aviso-cerrar:hover { color: rgba(0,0,0,0.88); }

  /* Botón flotante del modo final: descarga un video de una vuelta de la
     composición con su sonido. Los tokens del Button de Ant Design (primario
     y, mientras graba, el por defecto), escritos a mano como el aviso. */
  .boton-video {
    position: fixed;
    right: 18px; bottom: 40px;
    display: none; align-items: center; gap: 8px;
    height: 40px; padding: 0 15px;
    border: 1px solid #1677ff; border-radius: 8px;
    background: #1677ff; color: #fff;
    box-shadow: 0 2px 0 rgba(5,145,255,0.1), 0 6px 16px rgba(0,0,0,0.08);
    font-size: 16px; line-height: 1;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    z-index: 10;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .boton-video.visible { display: inline-flex; }
  .boton-video:hover { background: #4096ff; border-color: #4096ff; }
  .boton-video:active { background: #0958d9; border-color: #0958d9; }
  .boton-video svg { width: 16px; height: 16px; flex-shrink: 0; }
  .boton-video .punto-rec {
    display: none;
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff4d4f;
    animation: latido-rec 1s ease-in-out infinite;
  }
  .boton-video.ocupado,
  .boton-video.ocupado:hover,
  .boton-video.ocupado:active {
    background: #fff; border-color: #d9d9d9; color: rgba(0,0,0,0.88);
    box-shadow: 0 2px 0 rgba(0,0,0,0.02), 0 6px 16px rgba(0,0,0,0.08);
    cursor: default;
  }
  .boton-video.ocupado svg { display: none; }
  .boton-video.ocupado .punto-rec { display: block; }
  .boton-video.error, .boton-video.error:hover {
    background: #fff; border-color: #ffccc7; color: #ff4d4f; cursor: default;
  }
  .boton-video.error svg { display: none; }
  @keyframes latido-rec { 50% { opacity: 0.25; } }

  /* Color y opacidad de la selección, en el modo edición. La muestra imita
     la de tools/paleta_colores.html: un recuadro con sólo el color, sin
     código ni nombre. Al tocarla se abre el panel debajo. */
  .muestra-color {
    position: fixed;
    top: 16px; left: 16px;
    display: none;
    width: 34px; height: 26px; padding: 0;
    border: 1px solid #bbb; border-radius: 5px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    cursor: pointer;
    z-index: 15;
  }
  .muestra-color.visible { display: block; }
  .muestra-color span {
    position: absolute; inset: 3px;
    border-radius: 2px;
  }
  .panel-color {
    position: fixed;
    top: 50px; left: 16px;
    display: none;
    width: 232px; box-sizing: border-box;
    padding: 12px 14px;
    border: 1px solid #e3e3e3; border-radius: 8px;
    background: #fff; color: #333;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08), 0 3px 6px -4px rgba(0,0,0,0.12);
    font-size: 12px; line-height: 1.4;
    z-index: 15;
  }
  .panel-color.visible { display: block; }
  .panel-color .fila { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .panel-color .rotulo { width: 56px; flex-shrink: 0; color: #666; }
  .panel-color input[type=color] {
    width: 44px; height: 28px; padding: 0;
    border: 1px solid #bbb; border-radius: 5px; background: none; cursor: pointer;
  }
  .panel-color input[type=range] { flex: 1; min-width: 0; margin: 0; accent-color: #111; cursor: pointer; }
  .panel-color .valor { width: 36px; text-align: right; color: #666; font-variant-numeric: tabular-nums; }
  /* Las casillas por tipo, sólo con más de un elemento seleccionado. */
  .panel-color .tipos { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid #eee; }
  .panel-color .tipos:empty { display: none; }
  .panel-color input:disabled { opacity: 0.4; cursor: default; }
  .panel-color .todos { display: flex; align-items: flex-start; gap: 6px; color: #555; cursor: pointer; }
  .panel-color .todos input { margin: 2px 0 0; cursor: pointer; }
</style>
</head>
<body>
<canvas id="escena"></canvas>
<div id="vacio">No hay composiciones capturadas.</div>
<div id="pie">11 / 11  ·  ←</div>
<div id="aviso" class="aviso" role="status">
  <span class="aviso-icono">i</span>
  <div class="aviso-cuerpo">
    <div class="aviso-titulo">¿Finalizar la composición?</div>
    <div class="aviso-texto">Pulsa otra vez la barra espaciadora para confirmar.
Es definitivo: después ya no se puede seguir editando.</div>
  </div>
  <button id="avisoCerrar" class="aviso-cerrar" title="Cerrar" aria-label="Cerrar">×</button>
</div>
<button id="botonVideo" class="boton-video" type="button">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v8.5M4.5 6.5 8 10l3.5-3.5M2 12.5v1.5h12v-1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="punto-rec" aria-hidden="true"></span>
  <span id="botonVideoTexto">Descargar obra</span>
</button>
<button id="muestraColor" class="muestra-color" type="button"
        aria-label="Color y opacidad de la selección" aria-expanded="false" aria-controls="panelColor">
  <span id="muestraColorTinta"></span>
</button>
<div id="panelColor" class="panel-color" role="dialog" aria-label="Color y opacidad">
  <div class="fila">
    <span class="rotulo">Color</span>
    <input id="colorElegido" type="color" value="#000000">
  </div>
  <div class="fila">
    <span class="rotulo">Opacidad</span>
    <input id="opacidadElegida" type="range" min="0" max="100" step="1" value="100">
    <span id="opacidadValor" class="valor">100 %</span>
  </div>
  <div id="colorTipos" class="tipos"></div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Pantalla 11 de la experiencia: la composición de las tres capturas.
  //
  // Cada página de los dispositivos, al pulsar la barra espaciadora, guarda en
  // IndexedDB ("experiencia", almacén "capturas") un registro
  //   { imagen: PNG transparente, ancho, alto (px CSS), dpr,
  //     elementos: [...], version, fecha }
  // con clave "bandada", "guante" o "emg". El del guante es version 2 y
  // suma `sonido` (la grabación de Helm y sus eventos, o null; ver
  // documentacion/experiencia.md, sección 5.3).
  //
  // Dos modos (ver documentacion/experiencia.md, sección 4.4):
  //   edición  al entrar: se edita en silencio, como abajo
  //   final    la barra espaciadora pulsada dos veces (la primera pide
  //            confirmación) cierra la edición, sin vuelta atrás: guarda la
  //            escena en la clave "composicion", borra las marcas de edición
  //            y reproduce en loop la grabación del guante. Si la página se
  //            recarga, vuelve directo a este modo. Sólo quedan ← e Inicio,
  //            y, con sonido, el botón "Descargar obra" (ver VIDEO).
  //            Con sonido, la escena se mueve con él (ver REACCIONES y
  //            documentacion/experiencia.md, sección 5.5): los anillos y
  //            discos del guante vuelven a sonar en su momento, y la bandada
  //            y la EMG siguen el análisis de lo que suena.
  //
  // v2 (ver documentacion/experiencia.md, sección 4): los
  // `elementos` de las tres capturas se vuelcan en una sola lista ordenada,
  // la escena, y se redibujan en vector en un único canvas, donde cada uno
  // se puede seleccionar y modificar venga del dispositivo que venga.
  //
  // Mouse:
  //   clic                  selecciona el elemento de más arriba bajo el puntero
  //   Mayús+clic            lo suma a la selección o lo quita
  //   arrastrar             mueve la selección
  //   arrastrar en el vacío marco: selecciona todo lo que toca, aunque esté
  //                         debajo de otros (con Mayús, lo suma)
  //   clic al vacío         deselecciona
  //   tirador de la esquina o rueda
  //                         agranda o achica la selección. Los anillos, discos y
  //                         cuadriláteros cambian de tamaño; los puntos de la
  //                         bandada no: sólo se separan o se juntan.
  //   muestra de color      arriba a la izquierda, con algo seleccionado: al
  //                         tocarla, color, opacidad y, con varios
  //                         seleccionados, una casilla por tipo (ver
  //                         ENTRADA · Color)
  // Teclas:
  //   Ctrl+C / Ctrl+V       copia la selección / la pega desplazada, encima
  //   Supr, Retroceso       elimina la selección
  //   Ctrl+Z                deshace; Ctrl+Mayús+Z o Ctrl+Y rehace
  //   Esc                   deselecciona (con el aviso a la vista, sólo lo cancela)
  //   barra espaciadora ×2  finaliza la composición (antes de CONFIRMAR_MS;
  //                         cualquier edición en el medio cancela el aviso)
  //   ←       vuelve a experiencia.html#10
  //   Inicio  (operador) borra las capturas y vuelve a la pantalla 0
  //   V       diagnóstico: alterna entre la escena en vector y los PNG
  //           originales. Si la escena está bien construida, al alternar no
  //           se mueve nada (salvo el multiply del guante sobre la EMG, que
  //           los PNG no tienen: ver documentacion/experiencia.md). Mientras se
  //           ven los PNG la edición queda en pausa: no reflejan los cambios.
  //
  // composicion.html#demo arma una escena sintética con los cuatro tipos de
  // elemento, sin leer ni escribir la base: sirve para trabajar el editor sin
  // recorrer las tres páginas con el hardware. Su guante trae tiempos y un
  // sonido sintético (clics y un zumbido para el FSR), y su modo final no se
  // guarda: al recargar vuelve a la edición.
  //
  // El script va en capas, de la más pura a la más atada al DOM; cada una
  // usa sólo las de arriba:
  //   modelo   geometría · tipos · construcción · permisos · reacciones ·
  //            operaciones (funciones sobre listas de elementos, sin DOM ni
  //            estado)
  //   editor   historial · selección · portapapeles · comandos
  //   vista    dibujo de la escena y de las marcas de edición
  //   sonido   decodificar o sintetizar la grabación, reproducirla en loop,
  //            analizarla y llevar el cuadro de la animación
  //   video    grabar una vuelta de la animación con su sonido y descargarla
  //   entrada  gestos de puntero, rueda, teclado y cierre de la edición
  //   datos    IndexedDB, demo y arranque
  // ---------------------------------------------------------------

  // Orden de volcado, de abajo hacia arriba: lo grande y translúcido (los
  // cuadriláteros de la EMG) de fondo, el detalle fino (los puntos de la
  // bandada) encima. Es sólo el orden inicial de la escena.
  const CAPAS = ["emg", "guante", "bandada"];
  const NOMBRES = { emg: "dispositivo tres", guante: "dispositivo dos", bandada: "dispositivo uno" };
  const DEMO = location.hash === "#demo";
  const TAU = Math.PI * 2;

  // Tolerancias de la prueba de impacto, en px de pantalla para que no
  // dependan del encaje.
  const TOL_PUNTO_PX = 8;          // radio mínimo para tocar un punto de la bandada
  const TOL_BORDE_PX = 3;          // margen para discos y trazos de anillos
  const TOL_TIRADOR_PX = 8;        // medio lado del área que agarra el tirador

  // Edición.
  const ESCALA_MIN = 0.2;          // respecto del tamaño capturado
  const ESCALA_MAX = 8;
  const PASO_PEGADO = 16;          // px del marco que se corre cada pegado
  const HISTORIAL_MAX = 50;
  const UMBRAL_ARRASTRE_PX = 3;    // por debajo, fue un clic y no un arrastre
  const RUEDA_K = 0.0015;          // factor de escala por px de rueda: exp(-k·Δ)
  const RUEDA_PAUSA_MS = 350;      // una ráfaga de rueda es un solo paso de deshacer

  // Cierre de la edición y sonido.
  const CONFIRMAR_MS = 4000;       // plazo para la segunda barra espaciadora, como en 5, 7 y 9
  const FUNDIDO_INICIO_S = 0.005;  // fundidos de la costura del loop: el del inicio es
  const FUNDIDO_FIN_S = 0.05;      // mínimo para no ablandar el primer golpe
  const TASA_HZ = 48000;           // de la decodificación y de la demo (la de PipeWire)

  const DPR = Math.max(1, window.devicePixelRatio || 1);
  const lienzo = document.getElementById("escena");
  const g = lienzo.getContext("2d");
  const pieEl = document.getElementById("pie");
  const vacioEl = document.getElementById("vacio");

  // clave -> { registro, bitmap }. bitmap es null si el PNG no se pudo leer
  // (o en la demo): la escena no lo necesita salvo para capturas sin
  // `elementos`.
  const capturas = {};

  // La escena: { ancho, alto, elementos }. ancho/alto son el marco en px
  // CSS en que viven las coordenadas de los elementos (el tamaño de pantalla
  // en que se capturó); al dibujar, el marco se encaja en la ventana actual.
  // Así un cambio de tamaño de ventana no toca los elementos.
  let escena = null;
  let vista = "vector";             // "vector" | "png"
  // "edicion" → "confirmando" (aviso a la vista) → "final", sin vuelta
  // atrás. Si no se confirma, de "confirmando" se vuelve a "edicion".
  let etapa = "edicion";
  let hayCapturas = false;          // sin capturas no hay nada que finalizar
  let notaGuardado = "";            // para el pie, si falló guardar la composición
  // Modo final con sonido: efectoDe(el, cuadro) de la escena (ver
  // prepararReacciones) y el cuadro de la animación en curso. Mientras
  // cuadroActual es null, la escena se dibuja quieta.
  let reacciones = null;
  let cuadroActual = null;
  let pieBase = "11 / 11  ·  ←";

  // ===============================================================
  // MODELO · Geometría
  // ===============================================================

  // Encaje sin deformar (contain) de un rectángulo de origen en uno de
  // destino: escala k y desplazamiento (ox, oy) para centrarlo.
  function encaje(anchoO, altoO, anchoD, altoD) {
    const k = Math.min(anchoD / anchoO, altoD / altoO);
    return { k: k, ox: (anchoD - anchoO * k) / 2, oy: (altoD - altoO * k) / 2 };
  }

  function finito() {
    for (let i = 0; i < arguments.length; i++) {
      if (typeof arguments[i] !== "number" || !isFinite(arguments[i])) return false;
    }
    return true;
  }

  function acotar(v, min, max) { return Math.min(max, Math.max(min, v)); }

  function propio(obj, clave) { return Object.prototype.hasOwnProperty.call(obj, clave); }

  function copiaProfunda(v) { return JSON.parse(JSON.stringify(v)); }

  // Los rectángulos son siempre { x0, y0, x1, y1 } con x0 <= x1, y0 <= y1.
  function rectEntre(a, b) {
    return { x0: Math.min(a.x, b.x), y0: Math.min(a.y, b.y),
             x1: Math.max(a.x, b.x), y1: Math.max(a.y, b.y) };
  }

  function unirRects(rects) {
    if (!rects.length) return null;
    const u = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    for (const r of rects) {
      u.x0 = Math.min(u.x0, r.x0); u.y0 = Math.min(u.y0, r.y0);
      u.x1 = Math.max(u.x1, r.x1); u.y1 = Math.max(u.y1, r.y1);
    }
    return u;
  }

  function centroDe(r) { return { x: (r.x0 + r.x1) / 2, y: (r.y0 + r.y1) / 2 }; }

  function dentroDeRect(x, y, r) { return x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1; }

  // Distancia de (x, y) al punto más cercano y al más lejano del rectángulo.
  function distanciaMinARect(x, y, r) {
    return Math.hypot(Math.max(r.x0 - x, 0, x - r.x1), Math.max(r.y0 - y, 0, y - r.y1));
  }
  function distanciaMaxARect(x, y, r) {
    return Math.hypot(Math.max(x - r.x0, r.x1 - x), Math.max(y - r.y0, r.y1 - y));
  }

  function puntoEnPoligono(x, y, pts) {
    let dentro = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) dentro = !dentro;
    }
    return dentro;
  }

  function orientacion(a, b, c) {
    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  }

  function segmentosSeCortan(a, b, c, d) {
    return (orientacion(a, b, c) > 0) !== (orientacion(a, b, d) > 0) &&
           (orientacion(c, d, a) > 0) !== (orientacion(c, d, b) > 0);
  }

  // Un polígono (no necesariamente convexo) y un rectángulo se tocan si un
  // vértice de uno cae dentro del otro o si dos lados se cruzan.
  function poligonoTocaRect(pts, r) {
    for (const p of pts) if (dentroDeRect(p[0], p[1], r)) return true;
    const esq = [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]];
    for (const q of esq) if (puntoEnPoligono(q[0], q[1], pts)) return true;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      for (let k = 0; k < 4; k++) {
        if (segmentosSeCortan(pts[j], pts[i], esq[k], esq[(k + 1) % 4])) return true;
      }
    }
    return false;
  }

  // ===============================================================
  // MODELO · Tipos de elemento
  //
  // Elemento de escena, con forma común a todos los tipos: un centro (x, y),
  // una escala (lo que editan las operaciones), la geometría relativa al
  // centro en `forma` y el aspecto en `estilo`. Mover y escalar son la misma
  // cuenta para cualquier tipo: translate(x, y) · scale(escala).
  //
  // Cada tipo es una estrategia con la misma interfaz:
  //   desdeCaptura(e, origen, f)  elemento de escena desde lo que guardó la
  //                               captura, encajado con f; null si está roto
  //   dibujar(c, el, recursos)    en coordenadas locales (centro en el
  //                               origen, sin escala)
  //   caja(el)                    rectángulo que ocupa, en el marco
  //   toca(el, mx, my, px)        si (mx, my) lo toca; px es cuánto mide un px
  //                               de pantalla en el marco
  //   tocaRect(el, r)             si cruza el rectángulo r
  // Nada fuera de esta sección pregunta por un tipo concreto: un tipo nuevo
  // es una entrada en TIPOS y su fila en PERMITIDAS.
  //
  // Opcional, para cualquier tipo: `tiempos`, cuándo sonó el elemento en la
  // grabación del guante (ver tiemposDe).
  // ===============================================================
  let proximoId = 1;
  function nuevoId() { return proximoId++; }

  function nuevoElemento(origen, tipo, x, y, forma, estilo) {
    return { id: nuevoId(), origen: origen, tipo: tipo, x: x, y: y, escala: 1,
             forma: forma, estilo: estilo };
  }

  function alphaDe(e) {
    return finito(e.alpha) ? Math.max(0, Math.min(1, e.alpha)) : 1;
  }

  function estiloDe(e) {
    return { color: e.color || "#000", alpha: alphaDe(e), modo: e.modo || null };
  }

  function radioDe(el) { return el.forma.r * el.escala; }

  function cajaCircular(el, R) {
    return { x0: el.x - R, y0: el.y - R, x1: el.x + R, y1: el.y + R };
  }

  function verticesEnMarco(el) {
    const s = el.escala;
    return el.forma.puntos.map(function (p) { return [el.x + p[0] * s, el.y + p[1] * s]; });
  }

  // Punto de la bandada y disco del FSR: círculos rellenos que sólo difieren
  // en cuánto margen dan para tocarlos.
  function tipoCirculo(nombre, radioMinPx, margenPx) {
    return {
      desdeCaptura: function (e, origen, f) {
        if (!finito(e.x, e.y, e.r)) return null;
        return nuevoElemento(origen, nombre, f.ox + e.x * f.k, f.oy + e.y * f.k,
          { r: e.r * f.k }, estiloDe(e));
      },
      dibujar: function (c, el) {
        c.beginPath();
        c.arc(0, 0, el.forma.r, 0, TAU);
        c.fillStyle = el.estilo.color;
        c.fill();
      },
      caja: function (el) { return cajaCircular(el, radioDe(el)); },
      toca: function (el, mx, my, px) {
        return Math.hypot(mx - el.x, my - el.y) <= Math.max(radioDe(el), radioMinPx * px) + margenPx * px;
      },
      tocaRect: function (el, r) { return distanciaMinARect(el.x, el.y, r) <= radioDe(el); }
    };
  }

  const TIPOS = {
    punto: tipoCirculo("punto", TOL_PUNTO_PX, 0),
    disco: tipoCirculo("disco", 0, TOL_BORDE_PX),

    // Sólo el trazo intercepta, no el hueco: un anillo grande no bloquea lo
    // que rodea, ni lo atrapa un marco trazado adentro de él.
    anillo: {
      desdeCaptura: function (e, origen, f) {
        if (!finito(e.x, e.y, e.r)) return null;
        return nuevoElemento(origen, "anillo", f.ox + e.x * f.k, f.oy + e.y * f.k,
          { r: e.r * f.k, grosor: (finito(e.grosor) ? e.grosor : 1) * f.k }, estiloDe(e));
      },
      dibujar: function (c, el) {
        c.beginPath();
        c.arc(0, 0, el.forma.r, 0, TAU);
        c.lineWidth = el.forma.grosor;
        c.strokeStyle = el.estilo.color;
        c.stroke();
      },
      caja: function (el) {
        return cajaCircular(el, (el.forma.r + el.forma.grosor / 2) * el.escala);
      },
      toca: function (el, mx, my, px) {
        const s = el.escala;
        return Math.abs(Math.hypot(mx - el.x, my - el.y) - el.forma.r * s) <=
          el.forma.grosor * s / 2 + TOL_BORDE_PX * px;
      },
      // Las distancias del centro a los puntos del rectángulo cubren un
      // intervalo [min, max]; el rectángulo cruza la corona si ese intervalo
      // se superpone con [radio interior, radio exterior].
      tocaRect: function (el, r) {
        const s = el.escala, medio = el.forma.grosor / 2;
        return distanciaMinARect(el.x, el.y, r) <= (el.forma.r + medio) * s &&
               distanciaMaxARect(el.x, el.y, r) >= Math.max(0, el.forma.r - medio) * s;
      }
    },

    cuadrilatero: {
      desdeCaptura: function (e, origen, f) {
        if (!Array.isArray(e.puntos) || e.puntos.length < 3) return null;
        const pts = [];
        for (const p of e.puntos) {
          if (!Array.isArray(p) || !finito(p[0], p[1])) return null;
          pts.push([f.ox + p[0] * f.k, f.oy + p[1] * f.k]);
        }
        // Centro: el promedio de los vértices; para un cuadrilátero convexo
        // cae adentro.
        let cx = 0, cy = 0;
        for (const p of pts) { cx += p[0]; cy += p[1]; }
        cx /= pts.length; cy /= pts.length;
        const est = estiloDe(e);
        return nuevoElemento(origen, "cuadrilatero", cx, cy,
          { puntos: pts.map(function (p) { return [p[0] - cx, p[1] - cy]; }) },
          { color: est.color, alpha: est.alpha });
      },
      dibujar: function (c, el) {
        const pts = el.forma.puntos;
        c.beginPath();
        c.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
        c.closePath();
        c.fillStyle = el.estilo.color;
        c.fill();
      },
      caja: function (el) {
        const v = verticesEnMarco(el);
        return unirRects(v.map(function (p) { return { x0: p[0], y0: p[1], x1: p[0], y1: p[1] }; }));
      },
      toca: function (el, mx, my) {
        return puntoEnPoligono((mx - el.x) / el.escala, (my - el.y) / el.escala, el.forma.puntos);
      },
      tocaRect: function (el, r) { return poligonoTocaRect(verticesEnMarco(el), r); }
    },

    // Respaldo para capturas anteriores a `elementos`: el PNG entero. No se
    // construye desde un elemento de captura, sino con imagenDeRespaldo().
    imagen: {
      desdeCaptura: null,
      dibujar: function (c, el, recursos) {
        const bmp = recursos.bitmap(el.origen);
        if (!bmp) return;
        const w = el.forma.ancho, h = el.forma.alto;
        c.imageSmoothingQuality = "high";
        c.drawImage(bmp, -w / 2, -h / 2, w, h);
      },
      caja: function (el) {
        const w = el.forma.ancho * el.escala / 2, h = el.forma.alto * el.escala / 2;
        return { x0: el.x - w, y0: el.y - h, x1: el.x + w, y1: el.y + h };
      },
      toca: function () { return false; },
      tocaRect: function () { return false; }
    }
  };

  function cajaDe(el) { return TIPOS[el.tipo].caja(el); }
  function cajaDeGrupo(els) { return unirRects(els.map(cajaDe)); }

  // ===============================================================
  // MODELO · Construcción de la escena
  // ===============================================================

  // Convierte un elemento tal como lo guardó la captura a elemento de
  // escena. Un tipo desconocido o un dato roto devuelve null y el elemento
  // se ignora en silencio, como las líneas serie que no se reconocen.
  function convertirElemento(e, origen, f) {
    if (!e || typeof e !== "object" || !propio(TIPOS, e.tipo)) return null;
    const desde = TIPOS[e.tipo].desdeCaptura;
    const el = desde ? desde(e, origen, f) : null;
    const tiempos = el && tiemposDe(e);
    if (tiempos) el.tiempos = tiempos;
    return el;
  }

  // Los tiempos que la página del guante anota en ms desde el inicio de su
  // grabación: `t` en un anillo (cuándo sonó su nota), `t0` y `t1` en un
  // disco (de cruzar FSR_ON a bajar de FSR_OFF). Son datos del elemento y no
  // de su tipo, así que no pasan por desdeCaptura: van en `tiempos`, igual
  // para cualquier tipo. Ninguna operación los toca y copiaProfunda los
  // arrastra, así que una copia pegada suena con su original. Un valor roto
  // se descarta; `t0` y `t1` sólo van juntos. null si no queda ninguno.
  function tiemposDe(e) {
    const t = {};
    if (finito(e.t) && e.t >= 0) t.t = e.t;
    if (finito(e.t0, e.t1) && e.t0 >= 0 && e.t1 >= e.t0) { t.t0 = e.t0; t.t1 = e.t1; }
    return Object.keys(t).length ? t : null;
  }

  function imagenDeRespaldo(origen, m, f) {
    return nuevoElemento(origen, "imagen",
      f.ox + m.ancho * f.k / 2, f.oy + m.alto * f.k / 2,
      { ancho: m.ancho * f.k, alto: m.alto * f.k },
      { alpha: 1 });
  }

  function medidasDe(c) {
    const r = c.registro;
    return {
      ancho: r.ancho || (c.bitmap && c.bitmap.width) || window.innerWidth,
      alto: r.alto || (c.bitmap && c.bitmap.height) || window.innerHeight
    };
  }

  // Vuelca las capturas en una escena, en el orden de CAPAS y, dentro de
  // cada una, en el orden en que se dibujaron. El marco es la pantalla de la
  // primera captura: en la instalación las tres se toman en la misma, así
  // que el encaje de cada una en el marco es la identidad.
  function construirEscena(caps) {
    const presentes = CAPAS.filter(function (k) { return caps[k]; });
    const marco = presentes.length
      ? medidasDe(caps[presentes[0]])
      : { ancho: window.innerWidth, alto: window.innerHeight };
    const elementos = [];
    presentes.forEach(function (clave) {
      const c = caps[clave];
      const m = medidasDe(c);
      const f = encaje(m.ancho, m.alto, marco.ancho, marco.alto);
      if (Array.isArray(c.registro.elementos) && c.registro.version >= 1) {
        for (const e of c.registro.elementos) {
          const el = convertirElemento(e, clave, f);
          if (el) elementos.push(el);
        }
      } else if (c.bitmap) {
        elementos.push(imagenDeRespaldo(clave, m, f));
      }
    });
    return { ancho: marco.ancho, alto: marco.alto, elementos: elementos };
  }

  // ===============================================================
  // MODELO · Permisos: qué operación admite cada tipo de elemento. El resto
  // del código sólo pregunta `permite(el, op)`, nunca por tipos concretos.
  //
  // Agrandar (`escalar`) vale para lo que viene del guante (anillos y
  // discos) y de la EMG (cuadriláteros), no para los puntos de la bandada:
  // en una selección mixta los puntos se separan o se juntan con el resto,
  // pero conservan su radio. Un tipo sin operaciones (la `imagen` de
  // respaldo) no se puede ni seleccionar. `color` es cambiar el color y la
  // opacidad (estilo.color y estilo.alpha; el modo de fusión no se toca).
  // ===============================================================
  const PERMITIDAS = {
    punto:        ["mover", "copiar", "eliminar", "color"],
    anillo:       ["mover", "escalar", "copiar", "eliminar", "color"],
    disco:        ["mover", "escalar", "copiar", "eliminar", "color"],
    cuadrilatero: ["mover", "escalar", "copiar", "eliminar", "color"],
    imagen:       []
  };

  function permite(el, op) {
    return propio(PERMITIDAS, el.tipo) && PERMITIDAS[el.tipo].indexOf(op) >= 0;
  }

  function seleccionable(el) {
    return propio(PERMITIDAS, el.tipo) && PERMITIDAS[el.tipo].length > 0;
  }

  // Los de `els` que admiten `op`. Una operación sobre una selección mixta
  // se aplica a éstos y deja quietos a los demás.
  function admiten(els, op) {
    return els.filter(function (el) { return permite(el, op); });
  }

  // ===============================================================
  // MODELO · Reacciones al sonido, en el modo final.
  //
  // La animación es una capa visual, no una edición: en cada cuadro cada
  // elemento recibe un efecto { dx, dy, escala, alpha, encima } que
  // dibujarElemento aplica sobre su x, y, escala y alpha sin escribirlos.
  // La composición guardada no cambia, y lo que la persona movió o agrandó
  // se anima desde donde lo dejó.
  //
  // Igual que con los permisos, el dibujo no pregunta por tipos sino qué
  // reacciones tiene el elemento: un tipo nuevo, o uno que no se quiera
  // animar, es una fila de REACCIONES.
  //
  // El cuadro es lo que cambia en cada frame:
  //   { tMs, durMs, seg, senal: { envolvente, graves, agudos } }
  //   tMs    dónde va la reproducción dentro de la vuelta, en ms de la
  //          grabación (ya corregido por la latencia): se compara con los
  //          `tiempos` de los elementos
  //   durMs  lo que dura una vuelta
  //   seg    segundos continuos, para lo que no depende de la vuelta
  //   senal  el análisis de lo que suena, cada señal entre 0 y 1
  // ===============================================================
  const REACCIONES = {
    // a) Por eventos: los elementos del guante vuelven a contar su historia
    //    al ritmo en que se hicieron.
    anillo:       [{ r: "golpe", aumento: 0.25, durMs: 200 }],
    disco:        [{ r: "inflar" }],
    // b) Por análisis del audio: los que no tienen relación con el sonido.
    punto:        [{ r: "abrir", senal: "envolvente", ganancia: 0.03 },
                   { r: "temblar", senal: "agudos", px: 1.5 }],
    cuadrilatero: [{ r: "respirar", senal: "graves", ganancia: 0.05 }],
    imagen:       []
  };

  // El disco de la página del guante: su radio y su alpha siguen el pico de
  // la fuerza suavizada con `tau`. Copiado de allá (R_FSR_MIN, R_FSR_MAX,
  // ALPHA_MIN, TAU): si cambia allá, hay que cambiarlo acá.
  const DISCO_GUANTE = { rMin: 0.05, rMax: 0.14, alphaMin: 0.08, tau: 0.03 };
  const PASO_CURVA_MS = 10;

  // Rehace, a partir de los CC grabados, lo que hizo la página del guante
  // con la presión entre t0 y t1: la fuerza es el último CC, se suaviza y el
  // disco sigue su pico, que nunca baja. Devuelve el pico cada
  // PASO_CURVA_MS, o null si no hay CC (se grabó sin puerto MIDI).
  function curvaDeInflado(t0, t1, eventos) {
    const ccs = eventos.filter(function (e) {
      return e && e.tipo === "cc" && finito(e.t, e.valor) && e.t <= t1;
    });
    const pasos = Math.max(1, Math.ceil((t1 - t0) / PASO_CURVA_MS));
    const picos = new Float32Array(pasos + 1);
    const k = 1 - Math.exp(-PASO_CURVA_MS / 1000 / DISCO_GUANTE.tau);
    let fuerza = 0, suave = 0, pico = 0, j = 0, hubo = false;
    for (let n = 0; n <= pasos; n++) {
      const t = Math.min(t1, t0 + n * PASO_CURVA_MS);
      while (j < ccs.length && ccs[j].t <= t) {
        if (ccs[j].t >= t0) hubo = true;
        fuerza = acotar(ccs[j++].valor / 127, 0, 1);
      }
      if (n > 0) suave += (fuerza - suave) * k;
      pico = Math.max(pico, suave);
      picos[n] = pico;
    }
    return hubo && pico > 0 ? picos : null;
  }

  // Cuánto del tamaño y del alpha estampados tiene el disco a los tMs: el
  // radio y el alpha que da el pico de ese momento, relativos a los que da
  // el pico final (así al llegar a t1 queda exactamente como se estampó).
  // Sin curva, una rampa pareja de t0 a t1 hasta la presión máxima.
  function infladoEn(tMs, t0, t1, picos) {
    const D = DISCO_GUANTE;
    const radio = function (p) { return D.rMin + p * (D.rMax - D.rMin); };
    const alpha = function (p) { return D.alphaMin + p * (1 - D.alphaMin); };
    const fin = picos ? picos[picos.length - 1] : 1;
    let p;
    if (tMs >= t1) p = fin;
    else if (picos) p = picos[Math.min(picos.length - 1, Math.floor((tMs - t0) / PASO_CURVA_MS))];
    else p = fin * (tMs - t0) / Math.max(1, t1 - t0);
    return { escala: radio(p) / radio(fin), alpha: alpha(p) / alpha(fin) };
  }

  // Cada reacción suma lo suyo al efecto `ef`. `p` es su fila de REACCIONES
  // y `aux` lo que se preparó una vez para toda la escena.
  const REACCION = {
    // El anillo se vuelve a golpear cuando la reproducción pasa por su `t`:
    // late (1 → 1 + aumento → 1) y suelta el mismo anillo de impacto que se
    // expande y se desvanece en la página del guante. Después de la costura
    // del loop sigue: un golpe del final de la grabación termina de latir al
    // principio de la vuelta siguiente.
    golpe: function (el, p, ef, cuadro) {
      if (!el.tiempos || !finito(el.tiempos.t)) return;
      let dt = cuadro.tMs - el.tiempos.t;
      if (dt < 0) dt += cuadro.durMs;
      if (dt < 0 || dt >= p.durMs) return;
      const edad = dt / p.durMs;
      ef.escala *= 1 + p.aumento * Math.sin(Math.PI * edad);
      ef.encima = function (c) {
        c.globalAlpha = (1 - edad) * 0.55;
        c.strokeStyle = el.estilo.color;
        c.lineWidth = 2 / el.escala;
        c.beginPath();
        c.arc(0, 0, el.forma.r * (1 + 1.2 * edad), 0, TAU);
        c.stroke();
      };
    },

    // El disco no existe antes de su `t0`; entre `t0` y `t1` se infla con la
    // curva de la presión grabada y después queda. Cada vuelta empieza sin
    // él, como empezó el dibujo.
    inflar: function (el, p, ef, cuadro, aux) {
      const t = el.tiempos;
      if (!t || !finito(t.t0, t.t1)) return;
      if (cuadro.tMs < t.t0) { ef.escala = 0; return; }
      const f = infladoEn(cuadro.tMs, t.t0, t.t1, aux.curva(t.t0, t.t1));
      ef.escala *= f.escala;
      ef.alpha *= f.alpha;
    },

    // Se aleja del centro de los de su origen en proporción a la señal: la
    // bandada se abre y se cierra entera, unos pocos px.
    abrir: function (el, p, ef, cuadro, aux) {
      const c = aux.centro(el.origen);
      const v = cuadro.senal[p.senal] * p.ganancia;
      ef.dx += (el.x - c.x) * v;
      ef.dy += (el.y - c.y) * v;
    },

    // Temblor mínimo, con fase y frecuencia propias de cada elemento (sacadas
    // del id, para que no tiemblen todos juntos ni al azar en cada cuadro).
    temblar: function (el, p, ef, cuadro) {
      const v = cuadro.senal[p.senal] * p.px;
      if (!v) return;
      const fase = el.id * 2.39996, w = 40 + (el.id * 7) % 13;
      ef.dx += v * Math.sin(cuadro.seg * w + fase);
      ef.dy += v * Math.sin(cuadro.seg * (w + 3.1) + fase * 1.7);
    },

    respirar: function (el, p, ef, cuadro) {
      ef.escala *= 1 + cuadro.senal[p.senal] * p.ganancia;
    }
  };

  function reaccionesDe(el) {
    return propio(REACCIONES, el.tipo) ? REACCIONES[el.tipo] : [];
  }

  // Prepara una vez, para una escena que ya no cambia (la del modo final),
  // lo que las reacciones necesitan de toda la escena: el centro de cada
  // origen y la curva de cada presión (las copias pegadas de un disco
  // comparten la de su original). Devuelve efectoDe(el, cuadro).
  function prepararReacciones(elementos, eventos) {
    const sumas = {};
    for (const el of elementos) {
      const s = sumas[el.origen] || (sumas[el.origen] = { x: 0, y: 0, n: 0 });
      s.x += el.x; s.y += el.y; s.n++;
    }
    const centros = {};
    Object.keys(sumas).forEach(function (k) {
      centros[k] = { x: sumas[k].x / sumas[k].n, y: sumas[k].y / sumas[k].n };
    });
    const curvas = new Map();
    const aux = {
      centro: function (origen) { return centros[origen]; },
      curva: function (t0, t1) {
        const clave = t0 + "|" + t1;
        if (!curvas.has(clave)) curvas.set(clave, curvaDeInflado(t0, t1, eventos || []));
        return curvas.get(clave);
      }
    };
    return function efectoDe(el, cuadro) {
      const ef = { dx: 0, dy: 0, escala: 1, alpha: 1, encima: null };
      for (const p of reaccionesDe(el)) REACCION[p.r](el, p, ef, cuadro, aux);
      return ef;
    };
  }

  // ===============================================================
  // MODELO · Consultas y operaciones sobre listas de elementos. No tocan el
  // DOM ni el estado del editor: reciben la lista (y el marco) y devuelven
  // el resultado, o una transformación preparada que se aplica muchas veces
  // durante un gesto, siempre desde el estado inicial.
  // ===============================================================

  // El de más arriba que se pueda seleccionar bajo (mx, my).
  function elementoEn(elementos, mx, my, px) {
    for (let i = elementos.length - 1; i >= 0; i--) {
      const el = elementos[i];
      if (seleccionable(el) && TIPOS[el.tipo].toca(el, mx, my, px)) return el;
    }
    return null;
  }

  // Todos los que cruzan el rectángulo, tapados o no.
  function elementosEnRect(elementos, r) {
    return elementos.filter(function (el) {
      return seleccionable(el) && TIPOS[el.tipo].tocaRect(el, r);
    });
  }

  // Dónde puede quedar el centro de un elemento: dentro del marco, para que
  // nada se pierda fuera de la pantalla. Si ya estaba afuera (una copia
  // fantasma de la bandada) puede volver, pero no alejarse más.
  function limitesDelCentro(el, marco) {
    return { x0: Math.min(0, el.x), x1: Math.max(marco.ancho, el.x),
             y0: Math.min(0, el.y), y1: Math.max(marco.alto, el.y) };
  }

  // Traslado del grupo: aplicar(dx, dy) lleva cada elemento movible a su
  // posición inicial + (dx, dy). Se acota el desplazamiento del grupo y no
  // el de cada elemento, para que el grupo no se deforme contra un borde.
  function prepararTraslado(els, marco) {
    const movibles = admiten(els, "mover");
    if (!movibles.length) return null;
    let dxMin = -Infinity, dxMax = Infinity, dyMin = -Infinity, dyMax = Infinity;
    for (const el of movibles) {
      const L = limitesDelCentro(el, marco);
      dxMin = Math.max(dxMin, L.x0 - el.x); dxMax = Math.min(dxMax, L.x1 - el.x);
      dyMin = Math.max(dyMin, L.y0 - el.y); dyMax = Math.min(dyMax, L.y1 - el.y);
    }
    const inicio = movibles.map(function (el) { return { el: el, x: el.x, y: el.y }; });
    return function aplicar(dx, dy) {
      dx = acotar(dx, dxMin, dxMax);
      dy = acotar(dy, dyMin, dyMax);
      for (const o of inicio) { o.el.x = o.x + dx; o.el.y = o.y + dy; }
    };
  }

  // Restringe el factor k para que c + d·k quede en [lo, hi]. El intervalo
  // siempre contiene k = 1, porque la posición inicial c + d ya cumple.
  function acotarFactorEje(rango, c, d, lo, hi) {
    if (Math.abs(d) < 1e-9) return;
    const a = (lo - c) / d, b = (hi - c) / d;
    rango[0] = Math.max(rango[0], Math.min(a, b));
    rango[1] = Math.min(rango[1], Math.max(a, b));
  }

  // Escalado del grupo respecto del centro de su caja. aplicar(k) multiplica
  // por k la escala de lo que admite `escalar` y la distancia al centro de
  // lo que admite `mover`; devuelve el k efectivamente aplicado, acotado
  // para que ninguna escala salga de [ESCALA_MIN, ESCALA_MAX] y ningún
  // centro salga del marco. null si nada en el grupo se puede escalar.
  function prepararEscalado(els, marco) {
    const escalables = admiten(els, "escalar");
    if (!escalables.length) return null;
    const pivote = centroDe(cajaDeGrupo(els));
    const rango = [0, Infinity];
    for (const el of escalables) {
      rango[0] = Math.max(rango[0], Math.min(1, ESCALA_MIN / el.escala));
      rango[1] = Math.min(rango[1], Math.max(1, ESCALA_MAX / el.escala));
    }
    for (const el of admiten(els, "mover")) {
      const L = limitesDelCentro(el, marco);
      acotarFactorEje(rango, pivote.x, el.x - pivote.x, L.x0, L.x1);
      acotarFactorEje(rango, pivote.y, el.y - pivote.y, L.y0, L.y1);
    }
    const inicio = els.map(function (el) {
      return { el: el, x: el.x, y: el.y, escala: el.escala,
               mueve: permite(el, "mover"), crece: permite(el, "escalar") };
    });
    return {
      pivote: pivote,
      aplicar: function (k) {
        k = acotar(k, rango[0], rango[1]);
        for (const o of inicio) {
          if (o.mueve) {
            o.el.x = pivote.x + (o.x - pivote.x) * k;
            o.el.y = pivote.y + (o.y - pivote.y) * k;
          }
          if (o.crece) o.el.escala = o.escala * k;
        }
        return k;
      }
    };
  }

  // Copia de lo que admite `copiar`, en su orden de apilado y sin compartir
  // ningún objeto con la escena: lo que se edite después no la altera.
  function copiar(els) {
    return admiten(els, "copiar").map(copiaProfunda);
  }

  // Agrega a la escena una copia nueva de cada plantilla (con id propio y
  // sin compartir objetos con ellas), encima de todo y corrida
  // `desplazamiento` px en diagonal, sin sacar ningún centro del marco.
  function pegar(elementos, plantillas, desplazamiento, marco) {
    const nuevos = plantillas.map(function (p) {
      const el = copiaProfunda(p);
      el.id = nuevoId();
      return el;
    });
    const trasladar = prepararTraslado(nuevos, marco);
    if (trasladar) trasladar(desplazamiento, desplazamiento);
    return { elementos: elementos.concat(nuevos), nuevos: nuevos };
  }

  function eliminar(elementos, ids) {
    return elementos.filter(function (el) { return !ids.has(el.id); });
  }

  // Cambia en el lugar el color y/o la opacidad (los campos presentes en
  // `cambio`: { color, alpha }) de los de `els` que admiten `color`. Como un
  // gesto, escribe en los elementos: el paso del historial lo arma quien
  // llama. El anillo de impacto del modo final toma el color nuevo solo.
  function aplicarEstilo(els, cambio) {
    for (const el of admiten(els, "color")) {
      if (cambio.color !== undefined) el.estilo.color = cambio.color;
      if (cambio.alpha !== undefined) el.estilo.alpha = acotar(cambio.alpha, 0, 1);
    }
  }

  // ===============================================================
  // EDITOR · Historial: instantáneas de la lista de elementos. Con unos
  // cientos de elementos copiar la lista entera por paso es barato, y mucho
  // más simple y robusto que saber invertir cada operación.
  // ===============================================================
  function crearHistorial(max, leer, escribir) {
    const pasado = [], futuro = [];
    function foto() { return copiaProfunda(leer()); }
    function saltar(desde, hacia) {
      if (!desde.length) return false;
      hacia.push(foto());
      escribir(desde.pop());
      return true;
    }
    return {
      foto: foto,
      // `antes` es la foto tomada antes del cambio que se confirma.
      registrar: function (antes) {
        pasado.push(antes);
        if (pasado.length > max) pasado.shift();
        futuro.length = 0;
      },
      deshacer: function () { return saltar(pasado, futuro); },
      rehacer: function () { return saltar(futuro, pasado); }
    };
  }

  const historial = crearHistorial(HISTORIAL_MAX,
    function () { return escena.elementos; },
    function (els) { escena.elementos = els; });

  // ===============================================================
  // EDITOR · Selección: un conjunto de ids.
  // ===============================================================
  let seleccion = new Set();

  function idsDe(els) { return new Set(els.map(function (el) { return el.id; })); }

  // En orden de apilado.
  function seleccionados() {
    return escena.elementos.filter(function (el) { return seleccion.has(el.id); });
  }

  // Después de deshacer o eliminar, la selección sólo conserva lo que existe.
  function depurarSeleccion() {
    seleccion = idsDe(seleccionados());
  }

  // ===============================================================
  // EDITOR · Portapapeles interno (no el del sistema). Guarda copias, no
  // referencias: copiar y después mover o borrar el original no cambia lo
  // que se pega. Cada pegado de la misma copia se corre un paso más, para
  // que no caiga exactamente encima del anterior.
  // ===============================================================
  const portapapeles = { plantillas: [], pegados: 0 };

  // ===============================================================
  // EDITOR · Comandos: lo que dispara el teclado. Cada cambio discreto es un
  // paso del historial.
  // ===============================================================

  // `cambio` modifica la escena; si devuelve false no hubo nada que cambiar
  // y no se registra el paso.
  function aplicarCambio(cambio) {
    const antes = historial.foto();
    if (cambio() === false) return;
    historial.registrar(antes);
    depurarSeleccion();
    pedirDibujo();
  }

  function eliminarSeleccion() {
    const ids = idsDe(admiten(seleccionados(), "eliminar"));
    if (!ids.size) return;
    aplicarCambio(function () { escena.elementos = eliminar(escena.elementos, ids); });
  }

  function copiarSeleccion() {
    const copia = copiar(seleccionados());
    if (!copia.length) return;
    portapapeles.plantillas = copia;
    portapapeles.pegados = 0;
    pedirDibujo();
  }

  // Lo pegado queda seleccionado, listo para arrastrarlo a su lugar.
  function pegarPortapapeles() {
    if (!portapapeles.plantillas.length) return;
    aplicarCambio(function () {
      portapapeles.pegados++;
      const r = pegar(escena.elementos, portapapeles.plantillas,
        PASO_PEGADO * portapapeles.pegados, escena);
      escena.elementos = r.elementos;
      seleccion = idsDe(r.nuevos);
    });
  }

  function deshacer() {
    if (historial.deshacer()) { depurarSeleccion(); pedirDibujo(); }
  }

  function rehacer() {
    if (historial.rehacer()) { depurarSeleccion(); pedirDibujo(); }
  }

  // ===============================================================
  // VISTA · Dibujo de la escena
  // ===============================================================

  // Lo que un tipo puede necesitar de afuera para dibujarse: hoy, sólo el
  // PNG de la `imagen` de respaldo.
  const recursos = {
    bitmap: function (origen) {
      const c = capturas[origen];
      return c ? c.bitmap : null;
    }
  };

  // Cada elemento se dibuja con su propio modo de fusión: los anillos y el
  // disco del guante multiplican sobre lo que tengan debajo, sea del guante
  // o de la EMG, igual que entre ellos dentro de su captura.
  //
  // `ef`, en el modo final, es el efecto de sus reacciones al sonido (ver
  // MODELO · Reacciones): se suma a la posición y multiplica la escala y el
  // alpha, sin escribir nada en el elemento. `encima` dibuja algo más (el
  // anillo de impacto) en sus coordenadas, con su escala de la escena y sin
  // la del efecto.
  function dibujarElemento(c, el, ef) {
    const est = el.estilo;
    const x = el.x + (ef ? ef.dx : 0), y = el.y + (ef ? ef.dy : 0);
    const s = el.escala * (ef ? ef.escala : 1);
    const modo = est.modo || "source-over";
    if (s > 0) {
      c.save();
      c.translate(x, y);
      if (s !== 1) c.scale(s, s);
      c.globalAlpha = Math.min(1, est.alpha * (ef ? ef.alpha : 1));
      c.globalCompositeOperation = modo;
      TIPOS[el.tipo].dibujar(c, el, recursos);
      c.restore();
    }
    if (ef && ef.encima) {
      c.save();
      c.translate(x, y);
      if (el.escala !== 1) c.scale(el.escala, el.escala);
      c.globalCompositeOperation = modo;
      ef.encima(c);
      c.restore();
    }
  }

  // `cuadro` es el de la animación (null: la escena quieta). La pantalla
  // dibuja con cuadroActual y el video con el suyo (ver VIDEO).
  function dibujarEscena(c, cuadro) {
    const efectoDe = etapa === "final" && cuadro ? reacciones : null;
    for (const el of escena.elementos) {
      dibujarElemento(c, el, efectoDe ? efectoDe(el, cuadro) : null);
    }
  }

  // Diagnóstico: los PNG originales apilados como en la v1, cada uno
  // encajado en el marco. Entre capturas la composición es source-over.
  function dibujarPNG(c) {
    CAPAS.forEach(function (clave) {
      const cap = capturas[clave];
      if (!cap || !cap.bitmap) return;
      const m = medidasDe(cap);
      const f = encaje(m.ancho, m.alto, escena.ancho, escena.alto);
      c.imageSmoothingQuality = "high";
      c.drawImage(cap.bitmap, f.ox, f.oy, m.ancho * f.k, m.alto * f.k);
    });
  }

  // Encaje del marco de la escena en la ventana actual.
  function encajeVentana() {
    return encaje(escena.ancho, escena.alto, window.innerWidth, window.innerHeight);
  }

  // Cambiar width/height de un canvas lo borra y realoca: sólo al cambiar
  // el tamaño de la ventana, no en cada cuadro de un arrastre.
  function ajustarLienzo() {
    const W = window.innerWidth, H = window.innerHeight;
    lienzo.width = Math.round(W * DPR);
    lienzo.height = Math.round(H * DPR);
    lienzo.style.width = W + "px";
    lienzo.style.height = H + "px";
    pintar();
  }

  function pintar() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, lienzo.width, lienzo.height);
    if (!escena) return;
    const f = encajeVentana();
    g.setTransform(DPR * f.k, 0, 0, DPR * f.k, DPR * f.ox, DPR * f.oy);
    if (vista === "png") {
      dibujarPNG(g);
    } else {
      dibujarEscena(g, cuadroActual);
      if (etapa !== "final") pintarMarcasDeEdicion(f);
    }
  }

  // Un repintado por cuadro como mucho, por más eventos de puntero que
  // lleguen en el medio.
  let dibujoPedido = false;
  function pedirDibujo() {
    if (dibujoPedido) return;
    dibujoPedido = true;
    requestAnimationFrame(function () {
      dibujoPedido = false;
      pintar();
      actualizarPie();
    });
  }

  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }

  function actualizarPie() {
    const partes = [];
    if (DEMO) partes.push("demo");
    if (notaGuardado) partes.push(notaGuardado);
    if (etapa === "final") {
      // Sólo lo que el operador necesita saber: por qué no suena.
      const estado = estadoSonido();
      if (estado) partes.push(estado);
    } else if (vista === "png") {
      const hay = CAPAS.some(function (k) { return capturas[k] && capturas[k].bitmap; });
      partes.push(hay ? "PNG originales, edición en pausa (V)" : "sin PNG para comparar (V)");
    } else {
      if (seleccion.size) partes.push(plural(seleccion.size, "seleccionado", "seleccionados"));
      if (portapapeles.plantillas.length) {
        partes.push(plural(portapapeles.plantillas.length, "copiado", "copiados"));
      }
    }
    partes.push(pieBase);
    pieEl.textContent = partes.join("   ·   ");
    actualizarBotonVideo();
    actualizarColor();
  }

  // ===============================================================
  // VISTA · Marcas de edición: recuadros de la selección, el tirador de
  // escalar y lo que dibuje el gesto en curso (el marco de selección).
  // Van en px de pantalla (grosor constante con cualquier encaje), después
  // de la escena y nunca dentro de ella: no van a salir en la exportación.
  // ===============================================================
  const MARGEN_SEL_PX = 4;
  const LADO_MIN_SEL_PX = 12;
  const LADO_TIRADOR_PX = 9;

  function rectEnPantalla(r, f) {
    return { x0: f.ox + r.x0 * f.k, y0: f.oy + r.y0 * f.k,
             x1: f.ox + r.x1 * f.k, y1: f.oy + r.y1 * f.k };
  }

  // Caja de selección en pantalla: con margen y un lado mínimo, para que se
  // vea alrededor de un punto de 2 px.
  function recuadroEnPantalla(r, f) {
    const b = rectEnPantalla(r, f);
    b.x0 -= MARGEN_SEL_PX; b.y0 -= MARGEN_SEL_PX;
    b.x1 += MARGEN_SEL_PX; b.y1 += MARGEN_SEL_PX;
    if (b.x1 - b.x0 < LADO_MIN_SEL_PX) {
      const c = (b.x0 + b.x1) / 2; b.x0 = c - LADO_MIN_SEL_PX / 2; b.x1 = c + LADO_MIN_SEL_PX / 2;
    }
    if (b.y1 - b.y0 < LADO_MIN_SEL_PX) {
      const c = (b.y0 + b.y1) / 2; b.y0 = c - LADO_MIN_SEL_PX / 2; b.y1 = c + LADO_MIN_SEL_PX / 2;
    }
    return b;
  }

  // El tirador va en la esquina inferior derecha del recuadro de toda la
  // selección, y sólo si algo de ella admite escalar. Es la única fuente de
  // su posición: la usan tanto el dibujo como la prueba de impacto.
  function tiradorDe(sel, f) {
    if (!admiten(sel, "escalar").length) return null;
    const b = recuadroEnPantalla(cajaDeGrupo(sel), f);
    return { x: b.x1, y: b.y1 };
  }

  function tocaTirador(clientX, clientY) {
    const t = tiradorDe(seleccionados(), encajeVentana());
    return !!t && Math.abs(clientX - t.x) <= TOL_TIRADOR_PX && Math.abs(clientY - t.y) <= TOL_TIRADOR_PX;
  }

  // Blanco por debajo y negro encima: se lee sobre cualquier color.
  function trazarRecuadro(c, b, punteado) {
    c.setLineDash([]);
    c.lineWidth = 3;
    c.strokeStyle = "rgba(255,255,255,0.85)";
    c.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    c.setLineDash(punteado ? [4, 3] : []);
    c.lineWidth = 1;
    c.strokeStyle = "#111";
    c.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  }

  function pintarSeleccion(c, f) {
    const sel = seleccionados();
    if (!sel.length) return;
    for (const el of sel) trazarRecuadro(c, recuadroEnPantalla(cajaDe(el), f), true);
    const t = tiradorDe(sel, f);
    if (!t) return;
    // Con varios elementos, el recuadro conjunto muestra a qué pertenece el
    // tirador y respecto de qué centro se escala.
    if (sel.length > 1) trazarRecuadro(c, recuadroEnPantalla(cajaDeGrupo(sel), f), false);
    const l = LADO_TIRADOR_PX;
    c.setLineDash([]);
    c.fillStyle = "#fff";
    c.fillRect(t.x - l / 2, t.y - l / 2, l, l);
    c.lineWidth = 1;
    c.strokeStyle = "#111";
    c.strokeRect(t.x - l / 2, t.y - l / 2, l, l);
  }

  function pintarMarcoDeSeleccion(c, r, f) {
    const b = rectEnPantalla(r, f);
    c.fillStyle = "rgba(17,17,17,0.06)";
    c.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    trazarRecuadro(c, b, true);
  }

  function pintarMarcasDeEdicion(f) {
    g.save();
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";
    pintarSeleccion(g, f);
    if (gesto && gesto.h.pintar) gesto.h.pintar(g, f);
    g.restore();
  }

  // ===============================================================
  // SONIDO · La grabación del guante, en loop, en el modo final.
  //
  // Web Audio sólo para reproducir y para medir: la grabación se decodifica
  // a un AudioBuffer, así su duración es exacta (el WebM de Chrome no la
  // trae) y el reloj de la reproducción, que es también el de la animación,
  // es el de AudioContext.currentTime y no el de requestAnimationFrame. La
  // única síntesis es la de la demo.
  //
  // Se prepara al cargar, en un OfflineAudioContext, que no necesita gesto:
  // al confirmar el sonido arranca en el acto. El AudioContext de verdad, en
  // cambio, se crea recién dentro del manejador de la barra espaciadora que
  // confirma, porque sin un gesto el navegador no lo deja sonar.
  // ===============================================================

  // Promesa del AudioBuffer listo para el loop, o de null si no hay sonido.
  let bufferSonido = Promise.resolve(null);
  // Por qué no hay sonido ("" mientras se prepara o si lo hay).
  let motivoSinSonido = "";
  // La reproducción en curso; fuente es null hasta que el buffer está listo.
  const sonido = { ctx: null, fuente: null, analizador: null, inicio: 0, duracion: 0 };
  // De la captura del guante: los eventos (para la curva de cada presión) y
  // el corrimiento medido entre un evento y su sonido en la grabación.
  let eventosSonido = [];
  let latenciaMs = 0;

  function prepararSonido(captura) {
    const r = captura && captura.registro;
    const s = r && r.version >= 2 ? r.sonido : null;
    function sin(motivo) { motivoSinSonido = motivo; return Promise.resolve(null); }
    if (!r) return sin("sin captura del guante");
    if (!s) return sin("la captura del guante no tiene sonido");
    eventosSonido = Array.isArray(s.eventos) ? s.eventos : [];
    latenciaMs = finito(s.latenciaMs) ? s.latenciaMs : 0;
    if (typeof OfflineAudioContext === "undefined") return sin("sin Web Audio");
    let buffer;
    if (typeof Blob !== "undefined" && s.audio instanceof Blob) {
      buffer = s.audio.arrayBuffer().then(function (datos) {
        return new OfflineAudioContext(2, 1, TASA_HZ).decodeAudioData(datos);
      });
    } else if (DEMO && Array.isArray(s.eventos) && finito(s.duracion)) {
      buffer = sintetizarDemo(s);
    } else {
      return sin("la captura del guante no tiene sonido");
    }
    return buffer.then(function (buf) {
      if (!buf || !buf.length) return sin("la grabación está vacía");
      return suavizarCostura(buf);
    }, function (err) {
      return sin("no se pudo decodificar la grabación (" + (err && err.message || err) + ")");
    });
  }

  // La grabación termina en la cola de la reverb y empieza con el primer
  // golpe: el salto del loop casi no existe, pero una muestra que no sea
  // cero en el borde suena como un clic. Fundidos cortos en los dos
  // extremos, sobre el buffer, que es nuestro.
  function suavizarCostura(buf) {
    const nIni = Math.min(buf.length, Math.round(FUNDIDO_INICIO_S * buf.sampleRate));
    const nFin = Math.min(buf.length, Math.round(FUNDIDO_FIN_S * buf.sampleRate));
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < nIni; i++) d[i] *= i / nIni;
      for (let i = 0; i < nFin; i++) d[d.length - 1 - i] *= i / nFin;
    }
    return buf;
  }

  // Sonido de la demo, a partir de sus eventos, como si los hubiera tocado
  // Helm: cada nota es un clic de ruido filtrado (más agudo para el dedo 1)
  // y los CC del FSR suben y bajan un zumbido grave. Ruido con semilla: la
  // demo suena siempre igual.
  function sintetizarDemo(s) {
    const oac = new OfflineAudioContext(2, Math.ceil(s.duracion * TASA_HZ), TASA_HZ);
    const ruido = oac.createBuffer(1, TASA_HZ / 2, TASA_HZ);
    const d = ruido.getChannelData(0);
    let x = 1;
    for (let i = 0; i < d.length; i++) { x = (x * 16807) % 2147483647; d[i] = x / 1073741823.5 - 1; }

    const salida = oac.createGain();
    salida.gain.value = 0.4;
    salida.connect(oac.destination);

    const zumbido = oac.createOscillator();
    zumbido.type = "sawtooth";
    zumbido.frequency.value = 82;
    const grave = oac.createBiquadFilter();
    grave.type = "lowpass";
    grave.frequency.value = 320;
    const nivel = oac.createGain();
    nivel.gain.value = 0;
    zumbido.connect(grave); grave.connect(nivel); nivel.connect(salida);
    zumbido.start(0);

    for (const ev of s.eventos) {
      if (!ev || !finito(ev.t)) continue;
      const t = ev.t / 1000;
      if (ev.tipo === "nota") {
        const fuente = oac.createBufferSource();
        fuente.buffer = ruido;
        const filtro = oac.createBiquadFilter();
        filtro.type = "bandpass";
        filtro.frequency.value = ev.dedo ? 1600 : 700;
        filtro.Q.value = 1.5;
        const env = oac.createGain();
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(3 * (finito(ev.vel) ? ev.vel : 90) / 127, t + 0.002);
        env.gain.setTargetAtTime(0, t + 0.002, 0.06);
        fuente.connect(filtro); filtro.connect(env); env.connect(salida);
        fuente.start(t);
        fuente.stop(t + 0.5);
      } else if (ev.tipo === "cc" && finito(ev.valor)) {
        nivel.gain.setTargetAtTime(0.5 * ev.valor / 127, t, 0.08);
      }
    }
    return oac.startRendering();
  }

  function iniciarSonido() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || sonido.ctx) return;
    const ctx = new AC();
    sonido.ctx = ctx;
    // El pie avisa si el navegador lo dejó en pausa (al recargar en el modo
    // final no hubo gesto: arranca con la primera tecla o clic).
    ctx.onstatechange = pedirDibujo;
    bufferSonido.then(function (buf) {
      if (!buf) { ctx.close(); sonido.ctx = null; pedirDibujo(); return; }
      const fuente = ctx.createBufferSource();
      fuente.buffer = buf;
      fuente.loop = true;
      const analizador = ctx.createAnalyser();
      analizador.fftSize = 2048;
      // El suavizado lo hace seguir(), con ataque y caída propios.
      analizador.smoothingTimeConstant = 0;
      fuente.connect(analizador);
      analizador.connect(ctx.destination);
      // Un margen corto para que el arranque no se coma el primer golpe.
      const inicio = ctx.currentTime + 0.05;
      fuente.start(inicio);
      sonido.fuente = fuente;
      sonido.analizador = analizador;
      sonido.inicio = inicio;
      sonido.duracion = buf.duration;
      reacciones = prepararReacciones(escena.elementos, eventosSonido);
      requestAnimationFrame(animar);
      actualizarBotonVideo();
    });
  }

  function reanudarSonido() {
    if (sonido.ctx && sonido.ctx.state === "suspended") sonido.ctx.resume();
  }

  // Dónde va la reproducción dentro de la vuelta, en s; null sin sonido. Es
  // el reloj de la animación: con source.loop la vuelta dura exactamente
  // buf.duration, así que el módulo nunca se desfasa. Se le resta lo que
  // tarda el audio en salir por los parlantes, para que la imagen vaya con
  // lo que se oye y no con lo que se acaba de procesar.
  function relojSonido() {
    if (!sonido.fuente) return null;
    const ctx = sonido.ctx;
    const salida = (finito(ctx.baseLatency) ? ctx.baseLatency : 0) +
                   (finito(ctx.outputLatency) ? ctx.outputLatency : 0);
    const t = ctx.currentTime - salida - sonido.inicio;
    return t <= 0 ? 0 : t % sonido.duracion;
  }

  // ---------------------------------------------------------------
  // Análisis de lo que suena, para las reacciones de la bandada y la EMG.
  // Cada señal sale del AnalyserNode, se suaviza con un ataque rápido y una
  // caída más lenta, y se normaliza por su propio máximo reciente (que cae
  // muy despacio): así va de 0 a 1 sin importar a qué volumen se grabó. El
  // piso evita que, en un silencio largo, el ruido de fondo se agrande hasta
  // parecer una señal.
  // ---------------------------------------------------------------
  const SENALES = {
    // RMS de la forma de onda: cada golpe, incluidas la distorsión y la cola.
    envolvente: { ataqueS: 0.01, caidaS: 0.25, piso: 0.003 },
    // Energía por bandas del espectro (amplitud media de los bins).
    graves:     { desdeHz: 20, hastaHz: 250, ataqueS: 0.02, caidaS: 0.3, piso: 1e-4 },
    agudos:     { desdeHz: 3000, hastaHz: 10000, ataqueS: 0.01, caidaS: 0.15, piso: 1e-4 }
  };
  const REFERENCIA_CAIDA_S = 30;

  const analisis = { tiempo: null, frec: null, nivel: {}, ref: {}, ultimo: null };

  function seguir(nombre, crudo, dt) {
    const p = SENALES[nombre];
    const antes = analisis.nivel[nombre] || 0;
    const tau = crudo > antes ? p.ataqueS : p.caidaS;
    const nivel = antes + (crudo - antes) * (1 - Math.exp(-dt / tau));
    analisis.nivel[nombre] = nivel;
    const ref = Math.max(nivel, (analisis.ref[nombre] || 0) * Math.exp(-dt / REFERENCIA_CAIDA_S), p.piso);
    analisis.ref[nombre] = ref;
    return acotar(nivel / ref, 0, 1);
  }

  function energiaDeBanda(frec, desdeHz, hastaHz, tasa, fft) {
    const k0 = Math.max(1, Math.round(desdeHz * fft / tasa));
    const k1 = Math.min(frec.length - 1, Math.round(hastaHz * fft / tasa));
    let suma = 0;
    for (let k = k0; k <= k1; k++) suma += Math.pow(10, frec[k] / 10);   // dB → potencia
    return k1 >= k0 ? Math.sqrt(suma / (k1 - k0 + 1)) : 0;
  }

  // Las tres señales, 0-1, para un cuadro que llega `dt` s después del
  // anterior. Con dt = 0 (el contexto en pausa) no cambian.
  function medir(dt) {
    const an = sonido.analizador;
    if (!analisis.tiempo) {
      analisis.tiempo = new Float32Array(an.fftSize);
      analisis.frec = new Float32Array(an.frequencyBinCount);
    }
    an.getFloatTimeDomainData(analisis.tiempo);
    an.getFloatFrequencyData(analisis.frec);
    let suma = 0;
    for (let i = 0; i < analisis.tiempo.length; i++) suma += analisis.tiempo[i] * analisis.tiempo[i];
    const tasa = sonido.ctx.sampleRate, fft = an.fftSize;
    const senal = { envolvente: seguir("envolvente", Math.sqrt(suma / analisis.tiempo.length), dt) };
    ["graves", "agudos"].forEach(function (nombre) {
      const p = SENALES[nombre];
      senal[nombre] = seguir(nombre, energiaDeBanda(analisis.frec, p.desdeHz, p.hastaHz, tasa, fft), dt);
    });
    return senal;
  }

  // Un cuadro por frame mientras dure el modo final con sonido. El reloj es
  // el del audio: si el contexto está en pausa la imagen queda quieta en el
  // mismo punto, y arranca con él.
  function animar() {
    if (etapa !== "final" || !sonido.fuente) { cuadroActual = null; return; }
    const ahora = sonido.ctx.currentTime;
    const dt = analisis.ultimo === null ? 0 : acotar(ahora - analisis.ultimo, 0, 0.1);
    analisis.ultimo = ahora;
    const durMs = sonido.duracion * 1000;
    // tMs en el tiempo de la grabación: el sonido de un evento llega
    // latenciaMs después de su `t`, así que la imagen va ese tanto atrás.
    let tMs = (relojSonido() * 1000 - latenciaMs) % durMs;
    if (tMs < 0) tMs += durMs;
    cuadroActual = { tMs: tMs, durMs: durMs, seg: ahora, senal: medir(dt) };
    pintar();
    avanzarVideo(ahora);
    requestAnimationFrame(animar);
  }

  function estadoSonido() {
    if (motivoSinSonido) return "sin sonido: " + motivoSinSonido;
    if (sonido.ctx && sonido.ctx.state === "suspended") return "sonido en pausa: pulsa una tecla o haz clic";
    return "";
  }

  // ===============================================================
  // VIDEO · Exportar la composición animada con su sonido
  //
  // En el modo final con sonido, el botón "Descargar obra" graba en tiempo
  // real (canvas.captureStream + MediaRecorder) una vuelta exacta de la
  // animación con su sonido y la descarga. Se graba de un lienzo propio, no
  // del de la pantalla, por tres razones:
  //   - tamaño fijo: el marco encajado en VIDEO_ANCHO × VIDEO_ALTO, y no la
  //     ventana × devicePixelRatio, que en una pantalla de alta densidad es
  //     demasiado para codificar en tiempo real mientras se anima;
  //   - fondo pintado: el lienzo de la pantalla es transparente (el blanco
  //     lo pone el CSS) y el codificador descarta el alfa, así que saldría
  //     negro. Multiply sobre blanco no cambia nada: se ve igual que en
  //     pantalla;
  //   - reloj propio: el audio se toma del grafo antes de los parlantes, así
  //     que el cuadro del video no descuenta la latencia de salida, como sí
  //     hace relojSonido() para la pantalla. Las señales del análisis son
  //     las mismas.
  // Arranca VIDEO_ANTICIPO_S antes de una costura del loop (la grabación del
  // guante empieza con el primer golpe, y arrancar justo en la costura le
  // comería el ataque) y dura exactamente una vuelta, así que el archivo
  // también se puede reproducir en loop. La costura que se espera es como
  // mínimo el final de la primera vuelta: para entonces la normalización de
  // las señales ya se asentó.
  // ===============================================================
  // Caja en que se encaja el marco. En Brave headless (render por software)
  // 1280×720 graba a 30 cuadros/s y 1920×1080 a ~19, porque dibujar y
  // codificar comparten el hilo con la animación. Antes de subirlo, mirar
  // en la sala `__video().ultima.fps` con 1920×1080.
  const VIDEO_ANCHO = 1280, VIDEO_ALTO = 720;
  const VIDEO_FPS = 30;
  const VIDEO_BPS = 6e6;                          // techo: con gráficos planos sale ~10 MB por minuto
  const VIDEO_AUDIO_BPS = 192000;
  const VIDEO_ANTICIPO_S = 0.3;
  const VIDEO_ERROR_MS = 5000;                    // cuánto queda a la vista un error
  // En orden de preferencia: un MP4 lo abre cualquier reproductor y trae su
  // duración; el WebM de MediaRecorder no la trae (no se puede adelantar).
  const VIDEO_FORMATOS = [
    "video/mp4;codecs=avc1.640028,mp4a.40.2",
    "video/mp4;codecs=avc1,mp4a.40.2",
    "video/mp4;codecs=avc1,opus",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  const botonVideo = document.getElementById("botonVideo");
  const botonVideoTexto = document.getElementById("botonVideoTexto");
  // estado: "libre" → "esperando" (la costura) → "grabando" → "cerrando"
  // (MediaRecorder entrega el archivo) → "libre". `error` es el mensaje que
  // muestra el botón un rato después de una grabación fallida.
  const video = { estado: "libre", error: "", temporizador: 0, formato: null,
                  lienzo: null, c: null, f: null, pista: null, destino: null,
                  rec: null, desde: 0, hasta: 0, ultimoCuadro: 0, cuadros: 0,
                  ultima: null };   // { segundos, cuadros, fps } de la última grabación

  // El primer formato que este navegador sabe grabar, o "" si ninguno.
  function formatoDeVideo() {
    if (video.formato !== null) return video.formato;
    video.formato = "";
    if (typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported) {
      video.formato = VIDEO_FORMATOS.find(function (f) { return MediaRecorder.isTypeSupported(f); }) || "";
    }
    return video.formato;
  }

  function puedeGrabarVideo() {
    return etapa === "final" && !!sonido.fuente && sonido.ctx.state === "running" &&
      typeof lienzo.captureStream === "function" &&
      typeof sonido.ctx.createMediaStreamDestination === "function" &&
      formatoDeVideo() !== "";
  }

  // El cuadro de la animación para el video: el de la pantalla sin
  // descontar la latencia de salida (ver arriba).
  function cuadroVideo(ahora) {
    const durMs = sonido.duracion * 1000;
    let tMs = ((ahora - sonido.inicio) * 1000 - latenciaMs) % durMs;
    if (tMs < 0) tMs += durMs;
    const senal = cuadroActual ? cuadroActual.senal : { envolvente: 0, graves: 0, agudos: 0 };
    return { tMs: tMs, durMs: durMs, seg: ahora, senal: senal };
  }

  function pintarCuadroVideo(cuadro) {
    const c = video.c, f = video.f;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1;
    c.globalCompositeOperation = "source-over";
    c.fillStyle = "#fff";
    c.fillRect(0, 0, video.lienzo.width, video.lienzo.height);
    c.setTransform(f.k, 0, 0, f.k, f.ox, f.oy);
    dibujarEscena(c, cuadro);
  }

  function empezarVideo() {
    if (!puedeGrabarVideo()) return;
    const ctx = sonido.ctx, dur = sonido.duracion;
    let rec;
    try {
      if (!video.lienzo) {
        const k = Math.min(VIDEO_ANCHO / escena.ancho, VIDEO_ALTO / escena.alto);
        video.lienzo = document.createElement("canvas");
        // Lados pares: los codificadores de H.264 los piden.
        video.lienzo.width = 2 * Math.round(escena.ancho * k / 2);
        video.lienzo.height = 2 * Math.round(escena.alto * k / 2);
        video.c = video.lienzo.getContext("2d");
        video.f = encaje(escena.ancho, escena.alto, video.lienzo.width, video.lienzo.height);
      }
      // Que el flujo no arranque con un lienzo vacío.
      pintarCuadroVideo(cuadroVideo(ctx.currentTime));
      // Con 0 cuadros por segundo el flujo toma un cuadro sólo cuando se lo
      // pide (requestFrame): uno por cada uno que se dibuja, a VIDEO_FPS.
      let flujo = video.lienzo.captureStream(0);
      video.pista = flujo.getVideoTracks()[0];
      if (typeof video.pista.requestFrame !== "function") {
        video.pista.stop();
        flujo = video.lienzo.captureStream(VIDEO_FPS);
        video.pista = flujo.getVideoTracks()[0];
      }
      // El sonido sale del mismo analizador que va a los parlantes: es lo
      // que se oye, sin pasar por ningún micrófono.
      video.destino = ctx.createMediaStreamDestination();
      sonido.analizador.connect(video.destino);
      video.destino.stream.getAudioTracks().forEach(function (p) { flujo.addTrack(p); });
      rec = new MediaRecorder(flujo, {
        mimeType: formatoDeVideo(),
        videoBitsPerSecond: VIDEO_BPS,
        audioBitsPerSecond: VIDEO_AUDIO_BPS
      });
    } catch (err) {
      return fallarVideo(err);
    }
    // Cada grabación con sus partes y sus manejadores: los de una cancelada
    // no tocan la siguiente.
    const partes = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) partes.push(e.data); };
    rec.onstop = function () { if (video.rec === rec) terminarVideo(rec, partes); };
    rec.onerror = function (e) { if (video.rec === rec) fallarVideo(e.error || e); };
    video.rec = rec;
    // La primera costura que deje el anticipo por delante.
    const t = ctx.currentTime - sonido.inicio;
    const n = Math.floor((t + VIDEO_ANTICIPO_S) / dur) + 1;
    video.desde = sonido.inicio + n * dur - VIDEO_ANTICIPO_S;
    video.estado = "esperando";
    actualizarBotonVideo();
  }

  // Lo llama animar() en cada cuadro del modo final con sonido.
  function avanzarVideo(ahora) {
    if (video.estado !== "esperando" && video.estado !== "grabando") return;
    if (sonido.ctx.state !== "running") return fallarVideo(null, "Se pausó el sonido: no se guardó el video");
    if (video.estado === "esperando") {
      if (ahora < video.desde) return actualizarBotonVideo();
      try { video.rec.start(1000); } catch (err) { return fallarVideo(err); }
      video.estado = "grabando";
      // Una vuelta desde que se llamó a start(), que llega unos ms después
      // de la costura esperada. El archivo arranca unas decenas de ms más
      // tarde todavía (en Brave headless, ~70 ms) y queda así de corto; el
      // evento `start` no sirve para corregirlo: llega mucho después.
      video.desde = ahora;
      video.hasta = ahora + sonido.duracion;
      video.ultimoCuadro = -Infinity;
      video.cuadros = 0;
    }
    // El ritmo de los cuadros va por performance.now(): currentTime avanza a
    // saltos (de a bloques de audio) y daría cuadros irregulares.
    const ms = performance.now();
    if (ms - video.ultimoCuadro >= 1000 / VIDEO_FPS - 4) {
      // Paso fijo para no derivar, salvo que se haya atrasado más de un cuadro.
      video.ultimoCuadro = ms - video.ultimoCuadro < 2000 / VIDEO_FPS ? video.ultimoCuadro + 1000 / VIDEO_FPS : ms;
      pintarCuadroVideo(cuadroVideo(ahora));
      if (typeof video.pista.requestFrame === "function") video.pista.requestFrame();
      video.cuadros++;
    }
    if (ahora >= video.hasta) {
      const segundos = ahora - video.desde;
      video.ultima = { segundos: +segundos.toFixed(2), cuadros: video.cuadros,
                       fps: +(video.cuadros / segundos).toFixed(1) };
      video.estado = "cerrando";
      try { video.rec.stop(); } catch (err) { return fallarVideo(err); }
    }
    actualizarBotonVideo();
  }

  function terminarVideo(rec, partes) {
    const tipo = rec.mimeType || formatoDeVideo();
    soltarVideo();
    if (!partes.length) return fallarVideo(new Error("el grabador no entregó datos"));
    descargar(new Blob(partes, { type: tipo.split(";")[0] }), nombreDeVideo(tipo));
    video.estado = "libre";
    actualizarBotonVideo();
  }

  // Deja todo como antes de grabar: el grafo, las pistas y el grabador. El
  // lienzo del video se conserva para la próxima.
  function soltarVideo() {
    const rec = video.rec;
    video.rec = null;
    if (rec && rec.state !== "inactive") { try { rec.stop(); } catch (e) { /* ya parado */ } }
    if (video.destino) {
      try { sonido.analizador.disconnect(video.destino); } catch (e) { /* ya desconectado */ }
      video.destino.stream.getTracks().forEach(function (p) { p.stop(); });
      video.destino = null;
    }
    if (video.pista) { video.pista.stop(); video.pista = null; }
  }

  function fallarVideo(err, mensaje) {
    if (err) console.warn("video:", err);
    soltarVideo();
    video.estado = "libre";
    video.error = mensaje || "No se pudo grabar el video";
    clearTimeout(video.temporizador);
    video.temporizador = setTimeout(function () { video.error = ""; actualizarBotonVideo(); }, VIDEO_ERROR_MS);
    actualizarBotonVideo();
  }

  function descargar(blob, nombre) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // El navegador ya tomó el archivo; un minuto de margen por las dudas.
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function nombreDeVideo(tipo) {
    const d = new Date();
    const dos = function (n) { return String(n).padStart(2, "0"); };
    return "composicion-" + d.getFullYear() + "-" + dos(d.getMonth() + 1) + "-" + dos(d.getDate()) +
      "-" + dos(d.getHours()) + dos(d.getMinutes()) + (tipo.indexOf("video/mp4") === 0 ? ".mp4" : ".webm");
  }

  function minSeg(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function textoBotonVideo() {
    const ahora = sonido.ctx ? sonido.ctx.currentTime : 0;
    switch (video.estado) {
      case "esperando": return "El video empieza en " + Math.max(1, Math.ceil(video.desde - ahora)) + " s";
